BookingResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/BookingResult"
CancelRegistrationResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/BookingResult"
RegistrationListResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/RegistrationDetail"
PromoteWaitlistResponseEnvelope:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/PromoteWaitlistResult"
LotteryRunResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/LotteryRun"
LiftBookingBanResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/LiftBookingBanResult"
LiftBookingBanResult:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      const: ok
CreateBookingRequest:
  type: object
  required:
    - idempotency_key
  additionalProperties: false
  properties:
    idempotency_key:
      type: string
      minLength: 8
      maxLength: 128
    family_count:
      type: integer
      minimum: 0
      default: 0
      description: Allowed only for unlimited events.
BookingResult:
  type: object
  required:
    - registration
    - remaining_capacity
    - message
  properties:
    registration:
      "$ref": "#/Registration"
    ticket:
      oneOf:
        - "$ref": "./tickets.yaml#/RedactedTicket"
        - type: "null"
    remaining_capacity:
      type: integer
      minimum: 0
    message:
      type: string
    duplicate:
      type: boolean
      default: false
      description: True when the request resolved to an existing booking instead of creating a new registration.
Registration:
  type: object
  required:
    - registration_id
    - event_id
    - employee_id
    - status
    - idempotency_key
    - family_count
    - created_at
  properties:
    registration_id:
      type: string
      format: uuid
    event_id:
      type: string
      format: uuid
    employee_id:
      type: string
    status:
      "$ref": "./common.yaml#/BookingStatus"
    idempotency_key:
      type: string
    cancel_idempotency_key:
      type: string
    cancelled_at:
      type: string
      format: date-time
    cancel_reason:
      type: string
    family_count:
      type: integer
      minimum: 0
    created_at:
      type: string
      format: date-time
CancelRegistrationRequest:
  type: object
  required:
    - idempotency_key
  additionalProperties: false
  properties:
    idempotency_key:
      type: string
      minLength: 8
      maxLength: 128
    reason:
      type: string
      maxLength: 500
AdminCancelRegistrationRequest:
  type: object
  required:
    - idempotency_key
    - reason
  additionalProperties: false
  properties:
    idempotency_key:
      type: string
      minLength: 8
      maxLength: 128
    reason:
      type: string
      minLength: 1
      maxLength: 500
CancelledRegistration:
  type: object
  required:
    - registration_id
    - status
    - cancelled_at
  properties:
    registration_id:
      type: string
      format: uuid
    status:
      type: string
      const: cancelled
    cancelled_at:
      type: string
      format: date-time
    cancel_reason:
      type:
        - string
        - "null"
RegistrationDetail:
  type: object
  required:
    - registration_id
    - event_id
    - employee_id
    - status
    - idempotency_key
    - family_count
    - created_at
    - employee_name
  properties:
    registration_id:
      type: string
      format: uuid
    event_id:
      type: string
      format: uuid
    employee_id:
      type: string
    idempotency_key:
      type: string
    cancel_idempotency_key:
      type: string
    employee_name:
      type: string
    status:
      "$ref": "./common.yaml#/BookingStatus"
    family_count:
      type: integer
      minimum: 0
    cancellation_deadline:
      type:
        - string
        - "null"
      format: date-time
    cancel_reason:
      type:
        - string
        - "null"
    ticket:
      oneOf:
        - "$ref": "./tickets.yaml#/Ticket"
        - type: "null"
    created_at:
      type: string
      format: date-time
PromoteWaitlistResult:
  type: object
  required:
    - remaining_capacity
    - message
  properties:
    promoted:
      oneOf:
        - "$ref": "#/BookingResult"
        - type: "null"
    remaining_capacity:
      type: integer
      minimum: 0
    message:
      type: string
LotteryRunRequest:
  type: object
  required:
    - seed
  additionalProperties: false
  properties:
    seed:
      type: string
      minLength: 1
      maxLength: 128
LotteryRun:
  type: object
  required:
    - run_id
    - event_id
    - seed
    - status
    - winner_count
    - created_at
  properties:
    run_id:
      type: string
      format: uuid
    event_id:
      type: string
      format: uuid
    seed:
      type: string
    status:
      type: string
      enum:
        - completed
        - replayed
        - failed
    winner_count:
      type: integer
      minimum: 0
    waitlist_count:
      type: integer
      minimum: 0
    created_at:
      type: string
      format: date-time
