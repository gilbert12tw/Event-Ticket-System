EventListResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/EventSummary"
EventDetailResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/EventDetail"
EventAssetResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/EventAsset"
AdminHROptionsResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          type: object
          required:
            - sites
          properties:
            sites:
              type: array
              items:
                "$ref": "#/AdminOption"
AdminOption:
  type: object
  required:
    - value
    - label
  properties:
    value:
      type: string
    label:
      type: string
EventAsset:
  type: object
  required:
    - asset_id
    - event_id
    - file_name
    - content_type
    - size_bytes
    - created_by
    - created_at
  properties:
    asset_id:
      type: string
      format: uuid
    event_id:
      type: string
      format: uuid
    file_name:
      type: string
    content_type:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
    size_bytes:
      type: integer
      minimum: 0
      maximum: 5242880
    created_by:
      type: string
    created_at:
      type: string
      format: date-time
EventSummary:
  type: object
  required:
    - event_id
    - title
    - starts_at
    - registration_start
    - registration_close
    - event_city
    - event_site
    - capacity_type
    - capacity
    - remaining_capacity
    - allows_family
    - status
    - allocation_mode
    - rule
    - eligibility
    - current_user_status
  properties:
    event_id:
      type: string
      format: uuid
    title:
      type: string
    starts_at:
      type: string
      format: date-time
    registration_start:
      type: string
      format: date-time
    registration_close:
      type: string
      format: date-time
    event_city:
      type: string
    event_site:
      type: string
    capacity_type:
      "$ref": "./common.yaml#/CapacityType"
    capacity:
      type:
        - integer
        - "null"
      minimum: 1
      description: Positive for limited events; null for unlimited events.
    remaining_capacity:
      type:
        - integer
        - "null"
      minimum: 0
      description: Remaining inventory for limited events; null for unlimited events.
    allows_family:
      type: boolean
      description: Must be false for limited events; may be true for unlimited events.
    status:
      "$ref": "./common.yaml#/EventStatus"
    allocation_mode:
      "$ref": "./common.yaml#/AllocationMode"
    rule:
      "$ref": "./eligibility.yaml#/EligibilityRule"
    eligibility:
      "$ref": "./eligibility.yaml#/EligibilityDecision"
    current_user_status:
      type:
        - string
        - "null"
      description: Current employee booking status when visible to the caller.
    current_user_registration_id:
      type:
        - string
        - "null"
      description: Current employee registration identifier when visible to the caller.
    no_show_cooldown:
      "$ref": "#/NoShowCooldown"
    category:
      type:
        - string
        - "null"
    tags:
      type: array
      items:
        type: string
    entry_method:
      type:
        - string
        - "null"
    visibility:
      type:
        - string
        - "null"
EventDetail:
  allOf:
    - "$ref": "#/EventSummary"
    - type: object
      required:
        - description
        - registration_start
      properties:
        description:
          type: string
        registration_start:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
CreateEventRequest:
  type: object
  required:
    - title
    - description
    - starts_at
    - registration_start
    - registration_close
    - event_city
    - event_site
    - capacity_type
    - capacity
    - allows_family
    - rule
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
    description:
      type: string
    starts_at:
      type: string
      format: date-time
    ends_at:
      type:
        - string
        - "null"
      format: date-time
    registration_start:
      type: string
      format: date-time
    registration_close:
      type: string
      format: date-time
    event_city:
      type: string
    event_site:
      type: string
    capacity_type:
      "$ref": "./common.yaml#/CapacityType"
    capacity:
      type:
        - integer
        - "null"
      minimum: 1
      description: Required positive capacity for limited events; null for unlimited events.
    allows_family:
      type: boolean
      description: Must be false for limited events; may be true for unlimited events where bookings persist family_count.
    allocation_mode:
      "$ref": "./common.yaml#/AllocationMode"
      default: fcfs
      description: Phase 1 supports first-come-first-served booking and deterministic lottery allocation for limited events.
    rule:
      "$ref": "./eligibility.yaml#/EligibilityRuleInput"
    category:
      type: string
    tags:
      type: array
      items:
        type: string
    entry_method:
      type: string
      default: qr
    visibility:
      type: string
      default: eligible
UpdateEventRequest:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
    description:
      type: string
    starts_at:
      type: string
      format: date-time
    ends_at:
      type:
        - string
        - "null"
      format: date-time
    registration_start:
      type: string
      format: date-time
    registration_close:
      type: string
      format: date-time
    event_city:
      type: string
    event_site:
      type: string
    capacity_type:
      "$ref": "./common.yaml#/CapacityType"
    capacity:
      type:
        - integer
        - "null"
      minimum: 1
      description: Positive for limited events; null for unlimited events. Reductions below confirmed registrations must be rejected.
    allows_family:
      type: boolean
      description: Must remain false for limited events; may be true for unlimited events.
    allocation_mode:
      "$ref": "./common.yaml#/AllocationMode"
    category:
      type: string
    tags:
      type: array
      items:
        type: string
    entry_method:
      type: string
    visibility:
      type: string
ChangeEventStateRequest:
  type: object
  required:
    - status
    - reason
  additionalProperties: false
  properties:
    status:
      "$ref": "./common.yaml#/EventStatus"
    reason:
      type: string
      minLength: 1
      maxLength: 500
NoShowCooldown:
  type: object
  required:
    - active
  properties:
    active:
      type: boolean
    applies_to:
      type:
        - string
        - "null"
      enum:
        - limited
        - null
    until:
      type:
        - string
        - "null"
      format: date-time
    reason:
      type:
        - string
        - "null"
