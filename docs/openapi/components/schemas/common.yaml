ApiSuccessEnvelope:
  type: object
  required:
    - success
    - data
    - error
  properties:
    success:
      type: boolean
      const: true
    data:
      description: Endpoint-specific response payload.
    error:
      type: "null"
ApiErrorEnvelope:
  type: object
  required:
    - success
    - data
    - error
  properties:
    success:
      type: boolean
      const: false
    data:
      type: "null"
    error:
      type: string
      minLength: 1
ApiEnvelope:
  oneOf:
    - "$ref": "#/ApiSuccessEnvelope"
    - "$ref": "#/ApiErrorEnvelope"
ApiSuccessWithMetaEnvelope:
  allOf:
    - "$ref": "#/ApiSuccessEnvelope"
    - type: object
      properties:
        meta:
          "$ref": "#/FreshnessMeta"
FreshnessMeta:
  type: object
  required:
    - as_of
    - source
  properties:
    as_of:
      type: string
      format: date-time
    source:
      type: string
      enum:
        - reporting_projection
        - derived
        - operational
    lag_seconds:
      type: integer
      minimum: 0
    degraded:
      type: boolean
AuthMeResponse:
  allOf:
    - "$ref": "#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/EmployeeClaims"
AuthBootstrapResponse:
  allOf:
    - "$ref": "#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/AuthBootstrap"
AuthBootstrap:
  type: object
  required:
    - mock_profiles_enabled
    - mock_profiles
    - debug_chrome_enabled
  properties:
    mock_profiles_enabled:
      type: boolean
    mock_profiles:
      type: array
      items:
        "$ref": "#/MockProfile"
    debug_chrome_enabled:
      type: boolean
MockProfile:
  type: object
  required:
    - profile_id
    - display_name
    - role_claims
    - mapped_roles
    - department
    - site
    - city
    - grade
    - employment_status
  properties:
    profile_id:
      type: string
    display_name:
      type: string
    job_title:
      type:
        - string
        - "null"
    role_claims:
      type: array
      items:
        type: string
    mapped_roles:
      type: array
      items:
        "$ref": "#/AppRole"
    department:
      type: string
    site:
      type: string
    city:
      type: string
    grade:
      type: integer
    employment_status:
      type: string
EmployeeClaims:
  type: object
  required:
    - employee_id
    - display_name
    - role_claims
    - mapped_roles
    - department
    - site
    - city
    - grade
    - employment_status
    - claims_status
  properties:
    employee_id:
      type: string
    display_name:
      type: string
    job_title:
      type:
        - string
        - "null"
    role_claims:
      type: array
      items:
        type: string
    mapped_roles:
      type: array
      items:
        "$ref": "#/AppRole"
    department:
      type: string
    site:
      type: string
    city:
      type: string
    grade:
      type: integer
    employment_status:
      type: string
    claims_status:
      type: string
      enum:
        - complete
        - rejected
AppRole:
  type: string
  enum:
    - employee
    - activity_admin
    - checkin_staff
    - hr_admin
    - system_admin
CapacityType:
  type: string
  enum:
    - limited
    - unlimited
EventStatus:
  type: string
  enum:
    - draft
    - published
    - closed
    - cancelled
    - archived
BookingStatus:
  type: string
  enum:
    - confirmed
    - waitlisted
    - rejected
    - cancelled
    - checked_in
    - no_show
TicketStatus:
  type: string
  enum:
    - active
    - redeemed
    - revoked
    - expired
NotificationDeliveryStatus:
  type: string
  enum:
    - pending
    - sent
    - failed
    - suppressed
    - dead_letter
ReportExportStatus:
  type: string
  enum:
    - pending
    - ready
    - failed
AllocationMode:
  type: string
  enum:
    - fcfs
    - lottery
Warning:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      enum:
        - cross_city
        - registration_closing_soon
        - non_transferable_ticket
    message:
      type: string
    employee_city:
      type:
        - string
        - "null"
    event_city:
      type:
        - string
        - "null"
NoShowCooldown:
  type: object
  required:
    - active
  properties:
    active:
      type: boolean
    applies_to:
      type:
        - string
        - "null"
      enum:
        - limited
        - null
    until:
      type:
        - string
        - "null"
      format: date-time
    reason:
      type:
        - string
        - "null"
