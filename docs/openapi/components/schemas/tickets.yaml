TicketListResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/Ticket"
TicketResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          oneOf:
            - "$ref": "#/Ticket"
            - "$ref": "#/RedactedTicket"
RedactedTicketResponse:
  allOf:
    - "$ref": "./common.yaml#/ApiSuccessEnvelope"
    - type: object
      properties:
        data:
          "$ref": "#/RedactedTicket"
Ticket:
  allOf:
    - "$ref": "#/TicketBase"
    - type: object
      required:
        - signed_token
        - qr_payload
      properties:
        signed_token:
          type: string
          description: Signed ticket token for the employee who owns the ticket; it does not transfer ticket ownership.
        qr_payload:
          type: string
          description: QR payload rendered from the signed ticket token for employee check-in.
RedactedTicket:
  allOf:
    - "$ref": "#/TicketBase"
    - type: object
      description: Admin/governance ticket view. Ticket tokens are intentionally omitted from this schema.
TicketBase:
  type: object
  required:
    - ticket_id
    - registration_id
    - event_id
    - employee_id
    - status
    - sequence_number
    - expires_at
    - issued_at
    - family_count
    - non_transferable
  properties:
    ticket_id:
      type: string
      format: uuid
    event_id:
      type: string
      format: uuid
    employee_id:
      type: string
    event_title:
      type: string
    event_location:
      type: string
    event_starts_at:
      type: string
      format: date-time
    registration_id:
      type: string
      format: uuid
    sequence_number:
      type: integer
      minimum: 1
    status:
      "$ref": "./common.yaml#/TicketStatus"
    employee_name:
      type: string
    department:
      type: string
    city:
      type: string
    family_count:
      type: integer
      minimum: 0
    non_transferable:
      type: boolean
      const: true
    expires_at:
      type: string
      format: date-time
    issued_at:
      type: string
      format: date-time
    revoked_reason:
      type:
        - string
        - "null"
RevokeTicketRequest:
  type: object
  required:
    - reason
  additionalProperties: false
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
TicketHolder:
  type: object
  required:
    - display_name
    - department
    - city
  properties:
    display_name:
      type: string
    department:
      type: string
    city:
      type: string
