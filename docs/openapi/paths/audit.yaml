"/admin/audit-logs":
  get:
    tags:
      - Audit
    operationId: listAuditLogs
    x-required-roles:
      - hr_admin
      - system_admin
    summary: List audit log entries.
    parameters:
      - name: actor_id
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          "$ref": "../components/schemas/common.yaml#/AppRole"
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
      - name: entity_id
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      "200":
        description: Redacted audit log entries.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/audit.yaml#/AuditLogListResponse"
      "401":
        "$ref": "../components/responses.yaml#/Unauthorized"
      "403":
        "$ref": "../components/responses.yaml#/Forbidden"
