"/admin/hr/options":
  get:
    tags:
      - Admin
    operationId: getAdminHROptions
    x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
    summary: Read HR-backed administration options.
    description: Returns distinct HR source-of-truth site options used by activity forms and eligibility rules.
    responses:
      "200":
        description: HR-backed option lists.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/events.yaml#/AdminHROptionsResponse"
      "401":
        "$ref": "../components/responses.yaml#/Unauthorized"
      "403":
        "$ref": "../components/responses.yaml#/Forbidden"
