openapi: 3.1.0
info:
  title: Corporate Event Ticketing System API
  version: 0.1.0
  description: "Canonical product API contract for Phase 1. Product authentication is provider-claims based: the API validates an external provider token and derives employee identity, role, department, site, and city from claims. Product OpenAPI intentionally excludes local login/logout endpoints."
  license:
    name: Internal Use Only
    identifier: LicenseRef-Internal-Use-Only
servers:
  - url: "/api/v1"
    description: Version 1 API root
security:
  - ProviderBearerAuth: []
tags:
  - name: Auth
    description: Provider-claims identity and role mapping.
  - name: Events
    description: Employee event discovery and detail APIs.
  - name: Eligibility
    description: Eligibility decisions, previews, and impact reviews.
  - name: Bookings
    description: Employee booking and activity-admin registration governance.
  - name: Tickets
    description: Employee-bound electronic tickets and admin ticket governance.
  - name: Check-in
    description: Online and bounded offline check-in flows.
  - name: Notifications
    description: Notification preferences and delivery administration.
  - name: Reports
    description: HR/admin aggregate reports and CSV exports.
  - name: Audit
    description: Redacted sensitive action audit queries.
  - name: Admin
    description: Activity administration endpoints.
  - name: Ops
    description: Phase 2 ops control plane — capacity pressure, queue health, replay, report freshness, dashboard.
