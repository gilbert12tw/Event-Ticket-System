apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-kubernetes-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: cets-api-app-metrics
        metrics_path: /metrics
        static_configs:
          - targets:
              - cets-api.cets.svc:8080
            labels:
              signal_scope: app
      - job_name: cets-app-specific-exporter
        metrics_path: /probe
        params:
          module: [cets_ready]
          target: [http://localhost:8080/readyz]
        static_configs:
          - targets:
              - cets-api-metrics-sidecar-example.cets-observability.svc:7979
            labels:
              signal_scope: app-sidecar
      - job_name: cets-node-exporter
        static_configs:
          - targets:
              - node-exporter.cets-observability.svc:9100
            labels:
              signal_scope: use
      - job_name: cets-kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.cets-observability.svc:8080
            labels:
              signal_scope: orchestration-state
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cets-observability-reference
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.cets-observability.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cets-prometheus-discovery-read
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - nodes
      - pods
      - services
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cets-prometheus-discovery-read
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cets-prometheus-discovery-read
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cets-observability
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.6.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-kubernetes-reference
  volumeClaimTemplates:
    - metadata:
        name: tsdb
        labels:
          app.kubernetes.io/name: prometheus
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource-reference
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
