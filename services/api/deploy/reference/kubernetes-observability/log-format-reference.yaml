apiVersion: v1
kind: ConfigMap
metadata:
  name: log-format-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: log-format-reference
    app.kubernetes.io/part-of: cets-observability-reference
data:
  fluent-bit-parsers.conf: |
    [PARSER]
        Name        cets_json_structured
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Decode_Field_As json metadata

    [PARSER]
        Name        cets_logfmt_semistructured
        Format      regex
        Regex       ^time=(?<time>[^ ]+) level=(?<level>[^ ]+) trace_id=(?<trace_id>[^ ]*) action=(?<action>[^ ]+) status=(?<status>[^ ]+)(?<metadata>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name        cets_common_log_semistructured
        Format      regex
        Regex       ^(?<remote_addr>[^ ]+) - (?<actor>[^ ]+) \[(?<time>[^\]]+)\] "(?<method>[A-Z]+) (?<path>[^ ]+) (?<protocol>[^"]+)" (?<status>[0-9]{3}) (?<bytes>[0-9]+)$
        Time_Key    time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        cets_unstructured_fallback
        Format      regex
        Regex       ^(?<message>.*)$
  sample-log-lines.txt: |
    {"time":"2026-05-28T10:30:43.624Z","level":"INFO","msg":"booking completed","trace_id":"trace-reference","action":"registration.book","status":"success","metadata":{"event_id":"evt-reference"}}
    time=2026-05-28T10:30:43.624Z level=INFO trace_id=trace-reference action=registration.book status=success event_id=evt-reference
    10.0.0.1 - employee [28/May/2026:10:30:43 +0000] "GET /api/v1/events HTTP/1.1" 200 512
    booking completed for reference event
