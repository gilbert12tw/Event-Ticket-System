apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-reference-config
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
      resource:
        attributes:
          - key: deployment.environment
            value: reference
            action: upsert
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.cets-observability.svc:4318
      loki:
        endpoint: http://loki.cets-observability.svc:3100/loki/api/v1/push
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-collector
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.142.0
          args:
            - --config=/etc/otelcol/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: opentelemetry-collector-reference-config
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentelemetry-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
