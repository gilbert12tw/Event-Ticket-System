apiVersion: v1
kind: ConfigMap
metadata:
  name: database-exporter-alternatives-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: database-exporter-alternatives
    app.kubernetes.io/part-of: cets-observability-reference
data:
  mysqld-exporter.cnf: |
    [client]
    host=mysql.example.internal
    port=3306
    user=exporter
  prometheus-scrape.yml: |
    scrape_configs:
      - job_name: cets-mysql-exporter-reference
        static_configs:
          - targets:
              - mysql-exporter-reference.cets-observability.svc:9104
            labels:
              signal_scope: database-exporter
              database_engine: mysql
              reference_only: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: mysqld-exporter
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysqld-exporter
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.17.2
          args:
            - --config.my-cnf=/etc/mysqld-exporter/mysqld-exporter.cnf
            - --web.listen-address=0.0.0.0:9104
          ports:
            - name: metrics
              containerPort: 9104
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/mysqld-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: database-exporter-alternatives-reference
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: mysqld-exporter
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: mysqld-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
