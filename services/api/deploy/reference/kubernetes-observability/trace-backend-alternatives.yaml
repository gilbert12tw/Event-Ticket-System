apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-trace-backend
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: zipkin
              containerPort: 9411
          readinessProbe:
            httpGet:
              path: /
              port: query
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: query
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-trace-backend
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: zipkin
      port: 9411
      targetPort: zipkin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin-trace-backend
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.5.1
          ports:
            - name: query
              containerPort: 9411
          readinessProbe:
            httpGet:
              path: /health
              port: query
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: query
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-trace-backend
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zipkin
  ports:
    - name: query
      port: 9411
      targetPort: query
