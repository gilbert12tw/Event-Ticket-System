apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-log-collector-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: fluentd
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/cets-api-*.log
      pos_file /var/log/fluentd/cets-api.pos
      tag cets.api
      <parse>
        @type json
      </parse>
    </source>

    <filter cets.api>
      @type record_transformer
      <record>
        service_name cets-api
        collector fluentd
      </record>
    </filter>

    <match cets.api>
      @type loki
      url http://loki.cets-observability.svc:3100
      line_format json
      <label>
        service_name
        collector
      </label>
    </match>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-log-collector-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: cets-observability-reference
    observability.cets.dev/reference-only: "true"
data:
  vector.yaml: |
    sources:
      cets_api_logs:
        type: kubernetes_logs
        include_paths:
          - /var/log/containers/cets-api-*.log
    transforms:
      cets_api_json:
        type: remap
        inputs:
          - cets_api_logs
        source: |
          parsed = parse_json!(.message)
          . = merge(., parsed)
          .service_name = "cets-api"
          .collector = "vector"
    sinks:
      loki:
        type: loki
        inputs:
          - cets_api_json
        endpoint: http://loki.cets-observability.svc:3100
        encoding:
          codec: json
        labels:
          service_name: "{{ service_name }}"
          collector: "{{ collector }}"
