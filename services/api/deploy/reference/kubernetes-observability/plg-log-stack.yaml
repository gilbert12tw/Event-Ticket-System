apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-reference-config
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: cets-observability-reference
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /loki/chunks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-log-datasource-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cets-observability-reference
data:
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki.cets-observability.svc:3100
        jsonData:
          derivedFields:
            - name: Tempo trace
              matcherRegex: '"otel_trace_id":"([a-f0-9]{32})"'
              datasourceUid: Tempo
              url: "$${__value.raw}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.6.0
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: chunks
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-reference-config
  volumeClaimTemplates:
    - metadata:
        name: chunks
        labels:
          app.kubernetes.io/name: loki
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-log-viewer
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-log-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-log-viewer
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4.0
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
      volumes:
        - name: datasource
          configMap:
            name: grafana-log-datasource-reference
