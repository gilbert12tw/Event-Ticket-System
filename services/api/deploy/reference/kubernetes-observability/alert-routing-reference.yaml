apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-routing-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cets-observability-reference
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: local-review
      group_by:
        - alertname
        - service
        - severity
      routes:
        - matchers:
            - severity="critical"
          receiver: pagerduty-on-call-reference
          repeat_interval: 30m
          continue: true
    receivers:
      - name: local-review
        webhook_configs:
          - url: http://alert-review.cets-observability.svc:9099/review
            send_resolved: true
      - name: pagerduty-on-call-reference
        pagerduty_configs:
          - routing_key: managed-outside-reference
            severity: '{{ .CommonLabels.severity }}'
            class: '{{ .CommonLabels.alertname }}'
            component: '{{ .CommonLabels.service }}'
            group: cets-observability
            description: '{{ .CommonAnnotations.summary }}'
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - alertname
          - service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-routing-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alert-routing-reference
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-routing-reference
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
