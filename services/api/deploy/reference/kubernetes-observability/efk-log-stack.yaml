apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: elasticsearch
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: cets-observability-reference
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.2.2
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch.cets-observability.svc:9200
          ports:
            - name: web
              containerPort: 5601
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: cets-observability
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: cets-observability-reference
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: web
      port: 5601
      targetPort: web
