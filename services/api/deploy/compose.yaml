name: ${COMPOSE_PROJECT_NAME:-cets}

x-api-image: &api-image
  image: ${API_IMAGE_NAME:-cets-api}:${API_IMAGE_TAG:-dev}
  build:
    context: ../../..
    dockerfile: services/api/Dockerfile

services:
  app:
    <<: *api-image
    restart: unless-stopped
    environment:
      APP_ADDR: :8080
      APP_ENV: ${APP_ENV:-local}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      OPS_API_ENABLED: ${OPS_API_ENABLED:-false}
      DEMO_DEBUG_ENABLED: ${DEMO_DEBUG_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cets}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cets}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-local_dev_ticket_signing_secret_change_me}
      PROVIDER_TOKEN_SECRET: ${PROVIDER_TOKEN_SECRET:-local_dev_provider_token_secret_change_me}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      REDIS_URL: redis://redis:6379/0
      QUEUE_URL: redis://redis:6379/1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-cets-dev}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin_dev_password}
      MAILER_HOST: mailhog
      MAILER_PORT: 1025
      MAILER_FROM: ${MAILER_FROM:-no-reply@cets.local}
      MAILER_REDIRECT_TO: ${MAILER_REDIRECT_TO:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      OUTBOX_LEASE_TTL_SECONDS: ${OUTBOX_LEASE_TTL_SECONDS:-60}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-10}
      OUTBOX_BACKOFF_BASE_MS: ${OUTBOX_BACKOFF_BASE_MS:-500}
      OUTBOX_BACKOFF_MAX_MS: ${OUTBOX_BACKOFF_MAX_MS:-60000}
      WORKER_KINDS: ${WORKER_KINDS:-notification,projection,compensation,export}
      WORKER_CONCURRENCY_NOTIFICATION: ${WORKER_CONCURRENCY_NOTIFICATION:-4}
      WORKER_CONCURRENCY_PROJECTION: ${WORKER_CONCURRENCY_PROJECTION:-2}
      WORKER_CONCURRENCY_COMPENSATION: ${WORKER_CONCURRENCY_COMPENSATION:-1}
      WORKER_CONCURRENCY_EXPORT: ${WORKER_CONCURRENCY_EXPORT:-1}
      NO_SHOW_THRESHOLD: ${NO_SHOW_THRESHOLD:-1}
      NO_SHOW_COOLDOWN_DAYS: ${NO_SHOW_COOLDOWN_DAYS:-90}
      NO_SHOW_GRACE_HOURS: ${NO_SHOW_GRACE_HOURS:-24}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      BOOKING_RATE_LIMIT_RPS_PER_ACTOR: ${BOOKING_RATE_LIMIT_RPS_PER_ACTOR:-0}
      BOOKING_RATE_LIMIT_RPS_PER_EVENT: ${BOOKING_RATE_LIMIT_RPS_PER_EVENT:-0}
      RATE_LIMIT_OUTAGE_MODE: ${RATE_LIMIT_OUTAGE_MODE:-degrade}
      BOOKING_RATE_LIMIT_HASH_SECRET: ${BOOKING_RATE_LIMIT_HASH_SECRET:-local_dev_rate_limit_hash_secret_change_me}
      BOOKING_PREADMISSION: ${BOOKING_PREADMISSION:-off}
      BOOKING_CONTENTION_STRATEGY: ${BOOKING_CONTENTION_STRATEGY:-phase1}
      REDIS_OUTAGE_MODE: ${REDIS_OUTAGE_MODE:-degrade}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-20}
      RESERVATION_TTL_GRACE_SECONDS: ${RESERVATION_TTL_GRACE_SECONDS:-10}
      RESERVATION_COMPENSATION_INTERVAL_SECONDS: ${RESERVATION_COMPENSATION_INTERVAL_SECONDS:-30}
      REDIS_OPERATION_TIMEOUT_MS: ${REDIS_OPERATION_TIMEOUT_MS:-150}
      BOOKING_RESERVATION_HASH_SECRET: ${BOOKING_RESERVATION_HASH_SECRET:-local_dev_reservation_hash_secret_change_me}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cets-api}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-local-compose}
      CETS_REPLICA_ID: ${CETS_REPLICA_ID:-app}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    <<: *api-image
    restart: unless-stopped
    command: ["worker"]
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-45s}
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cets}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cets}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-local_dev_ticket_signing_secret_change_me}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      REDIS_URL: redis://redis:6379/0
      QUEUE_URL: redis://redis:6379/1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-cets-dev}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin_dev_password}
      MAILER_HOST: mailhog
      MAILER_PORT: 1025
      MAILER_FROM: ${MAILER_FROM:-no-reply@cets.local}
      MAILER_REDIRECT_TO: ${MAILER_REDIRECT_TO:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      OUTBOX_LEASE_TTL_SECONDS: ${OUTBOX_LEASE_TTL_SECONDS:-60}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-10}
      OUTBOX_BACKOFF_BASE_MS: ${OUTBOX_BACKOFF_BASE_MS:-500}
      OUTBOX_BACKOFF_MAX_MS: ${OUTBOX_BACKOFF_MAX_MS:-60000}
      WORKER_KINDS: ${WORKER_KINDS:-notification,projection,compensation,export}
      WORKER_CONCURRENCY_NOTIFICATION: ${WORKER_CONCURRENCY_NOTIFICATION:-4}
      WORKER_CONCURRENCY_PROJECTION: ${WORKER_CONCURRENCY_PROJECTION:-2}
      WORKER_CONCURRENCY_COMPENSATION: ${WORKER_CONCURRENCY_COMPENSATION:-1}
      WORKER_CONCURRENCY_EXPORT: ${WORKER_CONCURRENCY_EXPORT:-1}
      NO_SHOW_THRESHOLD: ${NO_SHOW_THRESHOLD:-1}
      NO_SHOW_COOLDOWN_DAYS: ${NO_SHOW_COOLDOWN_DAYS:-90}
      NO_SHOW_GRACE_HOURS: ${NO_SHOW_GRACE_HOURS:-24}
      BOOKING_PREADMISSION: ${BOOKING_PREADMISSION:-off}
      BOOKING_CONTENTION_STRATEGY: ${BOOKING_CONTENTION_STRATEGY:-phase1}
      REDIS_OUTAGE_MODE: ${REDIS_OUTAGE_MODE:-degrade}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-20}
      RESERVATION_TTL_GRACE_SECONDS: ${RESERVATION_TTL_GRACE_SECONDS:-10}
      RESERVATION_COMPENSATION_INTERVAL_SECONDS: ${RESERVATION_COMPENSATION_INTERVAL_SECONDS:-30}
      REDIS_OPERATION_TIMEOUT_MS: ${REDIS_OPERATION_TIMEOUT_MS:-150}
      CETS_REPLICA_ID: worker
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  migrate:
    <<: *api-image
    restart: "no"
    command: ["migrate"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cets}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cets}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *api-image
    restart: "no"
    command: ["seed"]
    environment:
      APP_ADDR: :8080
      APP_ENV: ${APP_ENV:-local}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cets}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cets}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-5000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-local_dev_ticket_signing_secret_change_me}
      PROVIDER_TOKEN_SECRET: ${PROVIDER_TOKEN_SECRET:-local_dev_provider_token_secret_change_me}
      NO_SHOW_THRESHOLD: ${NO_SHOW_THRESHOLD:-1}
      NO_SHOW_COOLDOWN_DAYS: ${NO_SHOW_COOLDOWN_DAYS:-90}
      NO_SHOW_GRACE_HOURS: ${NO_SHOW_GRACE_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cets}
      POSTGRES_USER: ${POSTGRES_USER:-cets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-cets-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  prometheus:
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "-config.file=/etc/loki/config.yml"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.5.0@sha256:507dfecd2f0949475d071c124bea1c26fc4f8c1cff0372eee57478d5b1c5fbff
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
      app:
        condition: service_healthy
      worker:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "-config.file=/etc/tempo/config.yml"
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    depends_on:
      app:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--path.rootfs=/host"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    restart: unless-stopped
    profiles: ["observability"]
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
