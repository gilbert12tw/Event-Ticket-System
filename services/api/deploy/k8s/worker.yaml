apiVersion: apps/v1
kind: Deployment
metadata:
  name: cets-worker
  labels:
    app.kubernetes.io/name: cets-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cets-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: cets-worker
          image: cets-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - worker
          envFrom:
            - configMapRef:
                name: cets-api-config
            - secretRef:
                name: cets-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
