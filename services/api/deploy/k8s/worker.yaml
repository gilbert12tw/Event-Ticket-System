apiVersion: apps/v1
kind: Deployment
metadata:
  name: cets-worker-notification
  labels:
    app.kubernetes.io/name: cets-worker-notification
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker-kind: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cets-worker-notification
      app.kubernetes.io/component: worker
      app.kubernetes.io/worker-kind: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-worker-notification
        app.kubernetes.io/component: worker
        app.kubernetes.io/worker-kind: notification
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: cets-worker
          image: cets-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - --kinds=notification
          env:
            - name: WORKER_KINDS
              value: notification
          envFrom:
            - configMapRef:
                name: cets-api-config
            - secretRef:
                name: cets-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
