apiVersion: v1
kind: Secret
metadata:
  name: cets-api-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-postgres-password
  DATABASE_URL: postgresql://cets:change-me-postgres-password@cets-postgres:5432/cets
  TOKEN_SIGNING_SECRET: replace-with-staging-token-signing-secret-32chars
  PROVIDER_TOKEN_SECRET: replace-with-staging-provider-token-secret-32chars
  OBJECT_STORAGE_ACCESS_KEY: change-me-minio-access-key
  OBJECT_STORAGE_SECRET_KEY: change-me-minio-secret-key
  MINIO_ROOT_USER: change-me-minio-access-key
  MINIO_ROOT_PASSWORD: change-me-minio-secret-key
