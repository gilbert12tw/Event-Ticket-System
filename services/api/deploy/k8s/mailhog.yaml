apiVersion: v1
kind: Service
metadata:
  name: cets-mailhog
  labels:
    app.kubernetes.io/name: cets-mailhog
    app.kubernetes.io/component: mailer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cets-mailhog
    app.kubernetes.io/component: mailer
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cets-mailhog
  labels:
    app.kubernetes.io/name: cets-mailhog
    app.kubernetes.io/component: mailer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cets-mailhog
      app.kubernetes.io/component: mailer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-mailhog
        app.kubernetes.io/component: mailer
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
