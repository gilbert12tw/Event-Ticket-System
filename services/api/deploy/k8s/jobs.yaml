apiVersion: batch/v1
kind: Job
metadata:
  name: cets-migrate
  labels:
    app.kubernetes.io/name: cets-migrate
    app.kubernetes.io/component: admin-process
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-migrate
        app.kubernetes.io/component: admin-process
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cets-migrate
          image: cets-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: cets-api-config
            - secretRef:
                name: cets-api-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cets-seed
  labels:
    app.kubernetes.io/name: cets-seed
    app.kubernetes.io/component: admin-process
spec:
  suspend: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-seed
        app.kubernetes.io/component: admin-process
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cets-seed
          image: cets-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - seed
          envFrom:
            - configMapRef:
                name: cets-api-config
            - secretRef:
                name: cets-api-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cets-minio-init
  labels:
    app.kubernetes.io/name: cets-minio-init
    app.kubernetes.io/component: object-storage-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cets-minio-init
        app.kubernetes.io/component: object-storage-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cets-api-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cets-api-secret
                  key: MINIO_ROOT_PASSWORD
            - name: OBJECT_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cets-api-config
                  key: OBJECT_STORAGE_BUCKET
          command:
            - /bin/sh
            - -c
          args:
            - |
              until mc alias set local http://cets-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 1; done
              mc mb --ignore-existing "local/$OBJECT_STORAGE_BUCKET"
