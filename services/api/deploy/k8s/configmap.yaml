apiVersion: v1
kind: ConfigMap
metadata:
  name: cets-api-config
data:
  APP_ADDR: ":8080"
  APP_ENV: staging
  AUTH_MODE: external_sso
  AUTO_MIGRATE: "false"
  OPS_API_ENABLED: "false"
  REQUEST_TIMEOUT_MS: "5000"
  DATABASE_TIMEOUT_MS: "5000"
  SHUTDOWN_TIMEOUT_MS: "10000"
  REDIS_URL: redis://cets-redis:6379/0
  QUEUE_URL: redis://cets-redis:6379/1
  OBJECT_STORAGE_ENDPOINT: http://cets-minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: cets-staging
  MAILER_HOST: cets-mailhog
  MAILER_PORT: "1025"
  MAILER_FROM: no-reply@cets.example
  MAILER_REDIRECT_TO: ""
  WORKER_POLL_INTERVAL_MS: "1000"
  WORKER_SHUTDOWN_GRACE_SECONDS: "30"
  WORKER_MAX_ATTEMPTS: "3"
  OUTBOX_BATCH_SIZE: "100"
  WORKER_BATCH_SIZE: "25"
  OUTBOX_LEASE_TTL_SECONDS: "60"
  OUTBOX_RETRY_MAX: "10"
  OUTBOX_BACKOFF_BASE_MS: "500"
  OUTBOX_BACKOFF_MAX_MS: "60000"
  WORKER_KINDS: notification,projection,compensation,export
  WORKER_CONCURRENCY_NOTIFICATION: "4"
  WORKER_CONCURRENCY_PROJECTION: "2"
  WORKER_CONCURRENCY_COMPENSATION: "1"
  WORKER_CONCURRENCY_EXPORT: "1"
  NO_SHOW_THRESHOLD: "1"
  NO_SHOW_COOLDOWN_DAYS: "90"
  NO_SHOW_GRACE_HOURS: "24"
  POSTGRES_DB: cets
  POSTGRES_USER: cets
