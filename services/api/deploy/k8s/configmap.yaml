apiVersion: v1
kind: ConfigMap
metadata:
  name: cets-api-config
data:
  APP_ADDR: ":8080"
  APP_ENV: staging
  AUTH_MODE: external_sso
  AUTO_MIGRATE: "false"
  REQUEST_TIMEOUT_MS: "5000"
  DATABASE_TIMEOUT_MS: "5000"
  SHUTDOWN_TIMEOUT_MS: "10000"
  REDIS_URL: redis://cets-redis:6379/0
  QUEUE_URL: redis://cets-redis:6379/1
  OBJECT_STORAGE_ENDPOINT: http://cets-minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: cets-staging
  MAILER_HOST: cets-mailhog
  MAILER_PORT: "1025"
  MAILER_FROM: no-reply@cets.example
  MAILER_REDIRECT_TO: ""
  WORKER_POLL_INTERVAL_MS: "1000"
  WORKER_MAX_ATTEMPTS: "3"
  WORKER_BATCH_SIZE: "25"
  NO_SHOW_THRESHOLD: "1"
  NO_SHOW_COOLDOWN_DAYS: "90"
  NO_SHOW_GRACE_HOURS: "24"
  POSTGRES_DB: cets
  POSTGRES_USER: cets
