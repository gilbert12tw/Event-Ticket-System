apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cets

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - app.yaml
  - worker.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - mailhog.yaml
  - jobs.yaml

images:
  - name: cets-api
    newName: cets-api
    newTag: dev

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: cets
      app.kubernetes.io/managed-by: kustomize
