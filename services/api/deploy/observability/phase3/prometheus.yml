global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cets-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:8080
          - backend-2:8080
          - backend-3:8080
        labels:
          service: cets-backend
          phase: phase3-compose

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
        labels:
          service: tempo
          phase: phase3-compose

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          phase: phase3-compose
