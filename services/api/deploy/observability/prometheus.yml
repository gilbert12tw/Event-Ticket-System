global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cets-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080
        labels:
          service: cets-api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
