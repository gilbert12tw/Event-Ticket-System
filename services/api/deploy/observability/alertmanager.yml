global:
  resolve_timeout: 5m

route:
  receiver: local-review
  group_by:
    - alertname
    - severity
    - slo
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-review

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - slo
