upstream cets_gateways {
  server gateway-1:8080 max_fails=1 fail_timeout=5s;
  server gateway-2:8080 max_fails=1 fail_timeout=5s;
  server gateway-3:8080 max_fails=1 fail_timeout=5s;
}

server {
  listen 8080;
  server_name _;
  add_header X-CETS-Edge-Replica $hostname always;

  location / {
    otel_span_attr peer.service cets-gateway;
    proxy_pass http://cets_gateways;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 3s;
    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    proxy_set_header baggage $http_baggage;
  }
}
