---
openapi: 3.1.0
info:
  title: Corporate Event Ticketing System API
  version: 0.1.0
  description: 'Canonical product API contract for Phase 1. Product authentication
    is provider-claims based: the API validates an external provider token and derives
    employee identity, role, department, site, and city from claims. Product OpenAPI
    intentionally excludes local login/logout endpoints.'
  license:
    name: Internal Use Only
    identifier: LicenseRef-Internal-Use-Only
servers:
- url: "/api/v1"
  description: Version 1 API root
security:
- ProviderBearerAuth: []
tags:
- name: Auth
  description: Provider-claims identity and role mapping.
- name: Events
  description: Employee event discovery and detail APIs.
- name: Eligibility
  description: Eligibility decisions, previews, and impact reviews.
- name: Bookings
  description: Employee booking and activity-admin registration governance.
- name: Tickets
  description: Employee-bound electronic tickets and admin ticket governance.
- name: Check-in
  description: Online and bounded offline check-in flows.
- name: Notifications
  description: Notification preferences and delivery administration.
- name: Reports
  description: HR/admin aggregate reports and CSV exports.
- name: Audit
  description: Redacted sensitive action audit queries.
- name: Admin
  description: Activity administration endpoints.
paths:
  "/auth/me":
    get:
      tags:
      - Auth
      operationId: getAuthMe
      x-required-roles:
      - employee
      - activity_admin
      - checkin_staff
      - hr_admin
      - system_admin
      summary: Read the current provider-claims identity.
      description: Returns the employee claims and mapped application roles derived
        from the external provider token. This endpoint never accepts caller-supplied
        employee identity.
      responses:
        '200':
          description: Current identity and mapped roles.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthMeResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/events":
    get:
      tags:
      - Events
      operationId: listEvents
      x-required-roles:
      - employee
      summary: List events visible to the current employee.
      description: Employee identity is derived from provider claims. The response
        includes eligibility summary, limited/unlimited status, family availability,
        and cross-city warnings where applicable.
      parameters:
      - name: capacity_type
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/CapacityType"
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/EventStatus"
      responses:
        '200':
          description: Events visible to the current employee.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/events/{event_id}":
    get:
      tags:
      - Events
      operationId: getEvent
      x-required-roles:
      - employee
      summary: Read event detail for the current employee.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '200':
          description: Event detail with booking policy and warnings.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/events/{event_id}/eligibility":
    get:
      tags:
      - Events
      operationId: getEventEligibility
      x-required-roles:
      - employee
      summary: Check current employee eligibility for an event.
      description: Checks provider/HR claims, event rules, capacity type, booking
        window, city/site warning policy, and no-show cooldown. Cross-city warnings
        are advisory and must not block otherwise eligible employees.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '200':
          description: Eligibility decision and non-blocking warnings.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EligibilityResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/events/{event_id}/bookings":
    post:
      tags:
      - Bookings
      operationId: createBooking
      x-required-roles:
      - employee
      summary: Book the current employee for an event.
      description: Creates a booking for the current employee derived from provider
        claims. Limited events allow at most one ticket per employee, reject family
        members, and must not oversell. Unlimited events do not decrement inventory,
        do not create waitlist entries, and persist family_count on the employee's
        main registration.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateBookingRequest"
      responses:
        '201':
          description: Booking confirmed or waitlisted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookingResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/me/registrations/{registration_id}/cancel":
    post:
      tags:
      - Bookings
      operationId: cancelMyRegistration
      x-required-roles:
      - employee
      summary: Cancel the current employee's registration.
      description: Employee self-cancellation is allowed only during the registration
        window. After cutoff, only an admin exception endpoint may cancel and must
        record reason and audit log.
      parameters:
      - "$ref": "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CancelRegistrationRequest"
      responses:
        '200':
          description: Registration cancelled.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CancelRegistrationResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events":
    get:
      tags:
      - Admin
      operationId: listAdminEvents
      x-required-roles:
      - activity_admin
      - checkin_staff
      - hr_admin
      - system_admin
      summary: List events for activity administration.
      description: Returns activity-admin event summaries for governance screens.
        Employee identity is still derived from provider claims; this endpoint is
        not a self-service employee data surface.
      responses:
        '200':
          description: Admin-visible events.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      tags:
      - Admin
      operationId: createAdminEvent
      x-required-roles:
      - activity_admin
      summary: Create an event.
      description: Activity admins create Phase 1 limited or unlimited events. Limited
        events require positive capacity, reject family-member expansion, and must
        not oversell; unlimited events use null capacity, may allow family_count on
        booking, and never create waitlist entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEventRequest"
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}":
    patch:
      tags:
      - Admin
      operationId: updateAdminEvent
      x-required-roles:
      - activity_admin
      summary: Update an event.
      description: Updates mutable event fields and records a new event version plus
        audit metadata. Capacity reductions that would violate confirmed registrations
        must be rejected with conflict.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateEventRequest"
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
    delete:
      tags:
      - Admin
      operationId: archiveAdminEvent
      x-required-roles:
      - activity_admin
      summary: Archive or delete-equivalent an event.
      description: Performs the Phase 1 delete-equivalent event lifecycle action.
        The implementation must preserve audit/versioning semantics and must not silently
        remove records required for reports or audit.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '200':
          description: Event archived or delete-equivalent action completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/state":
    post:
      tags:
      - Admin
      operationId: changeAdminEventState
      x-required-roles:
      - activity_admin
      summary: Change event state.
      description: Applies an explicit event state transition. Illegal transitions
        must return conflict and leave the event unchanged.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangeEventStateRequest"
      responses:
        '200':
          description: Event state changed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/duplicate":
    post:
      tags:
      - Admin
      operationId: duplicateAdminEvent
      x-required-roles:
      - activity_admin
      summary: Duplicate an event.
      description: Creates a new draft-style event from an existing event while preserving
        auditability and avoiding accidental publication without admin review.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '201':
          description: Event duplicated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetailResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/eligibility/preview":
    post:
      tags:
      - Eligibility
      operationId: previewAdminEventEligibility
      x-required-roles:
      - activity_admin
      summary: Preview event eligibility rule impact.
      description: Returns a match count for a proposed eligibility rule before saving
        it. Zero-match results are allowed for preview but must be explicitly confirmed
        before save.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EligibilityPreviewRequest"
      responses:
        '200':
          description: Eligibility preview result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EligibilityPreviewResponseEnvelope"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/admin/events/{event_id}/eligibility":
    put:
      tags:
      - Eligibility
      operationId: updateAdminEventEligibility
      x-required-roles:
      - activity_admin
      summary: Save an event eligibility rule version.
      description: Saves a new eligibility rule version and audits the change. A zero-match
        save must include explicit admin confirmation.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateEligibilityRequest"
      responses:
        '200':
          description: Eligibility rule saved.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EligibilityPreviewResponseEnvelope"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/eligibility-impact-reviews":
    get:
      tags:
      - Eligibility
      operationId: listEligibilityImpactReviews
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: List eligibility impact reviews.
      description: Lists active registration or ticket impacts caused by HR/provider
        claim changes or eligibility rule changes. HR/system admins may inspect these
        reviews without receiving unnecessary PII.
      responses:
        '200':
          description: Eligibility impact reviews.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EligibilityImpactReviewListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/admin/eligibility-impact-reviews/{review_id}/resolve":
    post:
      tags:
      - Eligibility
      operationId: resolveEligibilityImpactReview
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: Resolve an eligibility impact review.
      parameters:
      - "$ref": "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResolveImpactReviewRequest"
      responses:
        '200':
          description: Eligibility impact review resolved.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EligibilityImpactReviewResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/registrations":
    get:
      tags:
      - Bookings
      operationId: listAdminEventRegistrations
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: List registrations for an event.
      description: Returns redacted registration governance data for activity admins
        and HR/system reporting review, including status, ticket summary, cancellation
        reason, and waitlist visibility.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '200':
          description: Event registrations.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/admin/events/{event_id}/registrations/{registration_id}/cancel":
    post:
      tags:
      - Bookings
      operationId: cancelAdminEventRegistration
      x-required-roles:
      - activity_admin
      summary: Cancel a registration by admin exception.
      description: Allows an audited admin exception cancellation after cutoff when
        a reason is supplied. Employee self-cancellation continues to use the claims-derived
        `/me/registrations/{registration_id}/cancel` endpoint.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      - "$ref": "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminCancelRegistrationRequest"
      responses:
        '200':
          description: Registration cancelled by admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CancelRegistrationResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/waitlist/promote":
    post:
      tags:
      - Bookings
      operationId: promoteAdminEventWaitlist
      x-required-roles:
      - activity_admin
      summary: Promote the earliest eligible waitlisted registration.
      description: Promotes exactly one earliest eligible waitlisted registration
        inside the booking consistency boundary, issuing a ticket and recording audit
        and outbox effects or an auditable no-op/failure.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      responses:
        '200':
          description: Waitlist promotion result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PromoteWaitlistResponseEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/events/{event_id}/lottery-runs":
    post:
      tags:
      - Bookings
      operationId: createAdminEventLotteryRun
      x-required-roles:
      - activity_admin
      summary: Run deterministic lottery allocation.
      description: Runs or returns an existing replay-safe lottery allocation for
        the supplied event and seed, with winners, waitlist assignments, tickets,
        audit, and outbox effects.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LotteryRunRequest"
      responses:
        '201':
          description: Lottery run created or replayed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LotteryRunResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/me/tickets":
    get:
      tags:
      - Tickets
      operationId: listMyTickets
      x-required-roles:
      - employee
      summary: List tickets for the current employee.
      description: Returns non-transferable tickets bound to the employee identity
        derived from provider claims. Unlimited events show family_count on the employee
        main ticket and do not expose companion tickets.
      responses:
        '200':
          description: Current employee tickets.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TicketListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/tickets/{ticket_id}":
    get:
      tags:
      - Tickets
      operationId: getTicket
      x-required-roles:
      - employee
      - activity_admin
      - checkin_staff
      - hr_admin
      - system_admin
      summary: Read a ticket by id.
      description: Returns a token-bearing ticket to the owning employee and a token-redacted
        ticket to admin, HR/system, and check-in staff roles.
      parameters:
      - "$ref": "#/components/parameters/TicketId"
      responses:
        '200':
          description: Ticket detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TicketResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/admin/tickets/{ticket_id}/revoke":
    post:
      tags:
      - Tickets
      operationId: revokeAdminTicket
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: Revoke a ticket.
      description: Revokes a ticket with an admin-supplied reason and audit trail.
        Revoked or expired tokens must not redeem successfully.
      parameters:
      - "$ref": "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RevokeTicketRequest"
      responses:
        '200':
          description: Ticket revoked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RedactedTicketResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/checkins":
    post:
      tags:
      - Check-in
      operationId: createCheckIn
      x-required-roles:
      - checkin_staff
      summary: Redeem or reject a ticket at check-in.
      description: Redeems one employee-bound ticket token at most once. The response
        includes holder display fields for on-site verification. Duplicate, tampered,
        expired, holder-mismatch, and transfer attempts fail or are flagged with auditable
        reason fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateCheckInRequest"
      responses:
        '200':
          description: Check-in accepted, duplicated, rejected, or conflicted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CheckInResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/checkins/events/{event_id}/offline-package":
    get:
      tags:
      - Check-in
      operationId: getOfflineCheckInPackage
      x-required-roles:
      - checkin_staff
      summary: Download a bounded offline check-in package.
      description: Returns a single-event, staff-bound, device-bound, signed offline
        package valid for a limited time. Offline results remain provisional until
        sync.
      parameters:
      - "$ref": "#/components/parameters/EventId"
      - name: device_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Offline check-in package.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OfflineCheckInPackageResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/checkins/offline-sync":
    post:
      tags:
      - Check-in
      operationId: syncOfflineCheckIns
      x-required-roles:
      - checkin_staff
      summary: Sync provisional offline check-in scans.
      description: Syncs provisional offline scans and returns accepted, duplicate,
        or conflict per scan while preserving the first committed redemption as final.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OfflineCheckInSyncRequest"
      responses:
        '200':
          description: Offline check-in sync result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OfflineCheckInSyncResponseEnvelope"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/notifications/preferences":
    get:
      tags:
      - Notifications
      operationId: getNotificationPreferences
      x-required-roles:
      - employee
      summary: Read current employee notification preferences.
      responses:
        '200':
          description: Notification preferences.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationPreferencesResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    put:
      tags:
      - Notifications
      operationId: updateNotificationPreferences
      x-required-roles:
      - employee
      summary: Update current employee notification preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        '200':
          description: Notification preferences updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationPreferencesResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/admin/notifications/deliveries":
    get:
      tags:
      - Notifications
      operationId: listNotificationDeliveries
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: List notification delivery records.
      description: Lists delivery attempts, retry state, suppression, and dead-letter
        status for activity-admin or HR/system-admin review.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/NotificationDeliveryStatus"
      responses:
        '200':
          description: Notification delivery records.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationDeliveryListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/admin/notifications/deliveries/{delivery_id}/retry":
    post:
      tags:
      - Notifications
      operationId: retryNotificationDelivery
      x-required-roles:
      - activity_admin
      - hr_admin
      - system_admin
      summary: Retry a notification delivery.
      parameters:
      - "$ref": "#/components/parameters/DeliveryId"
      responses:
        '200':
          description: Notification delivery retry scheduled or completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationDeliveryResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/reports":
    get:
      tags:
      - Reports
      operationId: getAdminReports
      x-required-roles:
      - hr_admin
      - system_admin
      summary: Read aggregate HR/admin reports.
      description: Returns aggregate participation only, including family totals and
        city distribution. Phase 1 exports are CSV-only; Excel and PDF are non-goals
        unless a later spec adds them.
      responses:
        '200':
          description: Aggregate report summary.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportSummaryResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/admin/reports/exports":
    post:
      tags:
      - Reports
      operationId: createAdminReportExport
      x-required-roles:
      - hr_admin
      - system_admin
      summary: Create an aggregate CSV report export.
      description: Creates an HR-authorized aggregate CSV export backed by object
        storage. Excel/PDF exports, employee rows, signed tokens, QR payloads, provider
        tokens, session data, and raw audit metadata are not part of Phase 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReportExportRequest"
      responses:
        '201':
          description: Report export created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportExportResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/admin/reports/exports/{export_id}":
    get:
      tags:
      - Reports
      operationId: getAdminReportExport
      x-required-roles:
      - hr_admin
      - system_admin
      summary: Read report export status.
      parameters:
      - "$ref": "#/components/parameters/ExportId"
      responses:
        '200':
          description: Report export status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportExportResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/admin/audit-logs":
    get:
      tags:
      - Audit
      operationId: listAuditLogs
      x-required-roles:
      - hr_admin
      - system_admin
      summary: List audit log entries.
      parameters:
      - name: actor_id
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/AppRole"
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
      - name: entity_id
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Redacted audit log entries.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuditLogListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
components:
  securitySchemes:
    ProviderBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Provider token
      description: External identity provider token with required employee claims.
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiSuccessEnvelope:
      type: object
      required:
      - success
      - data
      - error
      properties:
        success:
          type: boolean
          const: true
        data:
          description: Endpoint-specific response payload.
        error:
          type: 'null'
    AppRole:
      type: string
      enum:
      - employee
      - activity_admin
      - checkin_staff
      - hr_admin
      - system_admin
    EmployeeClaims:
      type: object
      required:
      - employee_id
      - display_name
      - role_claims
      - mapped_roles
      - department
      - site
      - city
      - claims_status
      properties:
        employee_id:
          type: string
        display_name:
          type: string
        job_title:
          type:
          - string
          - 'null'
        role_claims:
          type: array
          items:
            type: string
        mapped_roles:
          type: array
          items:
            "$ref": "#/components/schemas/AppRole"
        department:
          type: string
        site:
          type: string
        city:
          type: string
        claims_status:
          type: string
          enum:
          - complete
          - degraded_read_only
          - rejected
    AuthMeResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/EmployeeClaims"
    ApiErrorEnvelope:
      type: object
      required:
      - success
      - data
      - error
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          type: string
          minLength: 1
    CapacityType:
      type: string
      enum:
      - limited
      - unlimited
    EventStatus:
      type: string
      enum:
      - draft
      - published
      - closed
      - cancelled
      - archived
    Warning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - cross_city
          - registration_closing_soon
          - non_transferable_ticket
        message:
          type: string
        employee_city:
          type:
          - string
          - 'null'
        event_city:
          type:
          - string
          - 'null'
    NoShowCooldown:
      type: object
      required:
      - active
      properties:
        active:
          type: boolean
        applies_to:
          type:
          - string
          - 'null'
          enum:
          - limited
          -
        until:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type:
          - string
          - 'null'
    EligibilityDecision:
      type: object
      required:
      - event_id
      - eligible
      - can_book
      - reasons
      - warnings
      - no_show_cooldown
      properties:
        event_id:
          type: string
          format: uuid
        eligible:
          type: boolean
        can_book:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/Warning"
        no_show_cooldown:
          "$ref": "#/components/schemas/NoShowCooldown"
    EventSummary:
      type: object
      required:
      - event_id
      - title
      - starts_at
      - registration_closes_at
      - event_city
      - event_site
      - capacity_type
      - capacity
      - remaining_capacity
      - allows_family
      - status
      - eligibility
      properties:
        event_id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        event_city:
          type: string
        event_site:
          type: string
        capacity_type:
          "$ref": "#/components/schemas/CapacityType"
        capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Positive for limited events; null for unlimited events.
        remaining_capacity:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Remaining inventory for limited events; null for unlimited
            events.
        allows_family:
          type: boolean
          description: Must be false for limited events; may be true for unlimited
            events.
        status:
          "$ref": "#/components/schemas/EventStatus"
        eligibility:
          "$ref": "#/components/schemas/EligibilityDecision"
        current_booking_status:
          type:
          - string
          - 'null'
          description: Current employee booking status when visible to the caller.
        category:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
        entry_method:
          type:
          - string
          - 'null'
        visibility:
          type:
          - string
          - 'null'
    EventListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - events
            properties:
              events:
                type: array
                items:
                  "$ref": "#/components/schemas/EventSummary"
    EventDetail:
      allOf:
      - "$ref": "#/components/schemas/EventSummary"
      - type: object
        required:
        - description
        - registration_opens_at
        - ticket_transfer_policy
        properties:
          description:
            type: string
          registration_opens_at:
            type: string
            format: date-time
          ticket_transfer_policy:
            type: string
            const: non_transferable
          tags:
            type: array
            items:
              type: string
    EventDetailResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/EventDetail"
    EligibilityResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/EligibilityDecision"
    CreateBookingRequest:
      type: object
      required:
      - idempotency_key
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        family_count:
          type: integer
          minimum: 0
          default: 0
          description: Allowed only for unlimited events.
    BookingStatus:
      type: string
      enum:
      - confirmed
      - waitlisted
      - rejected
      - cancelled
      - checked_in
      - no_show
    BookingResult:
      type: object
      required:
      - registration_id
      - event_id
      - status
      - capacity_type
      - family_count
      - warnings
      properties:
        registration_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          "$ref": "#/components/schemas/BookingStatus"
        capacity_type:
          "$ref": "#/components/schemas/CapacityType"
        ticket_id:
          type:
          - string
          - 'null'
          format: uuid
        family_count:
          type: integer
          minimum: 0
        cancellation_deadline:
          type:
          - string
          - 'null'
          format: date-time
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/Warning"
    BookingResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/BookingResult"
    CancelRegistrationRequest:
      type: object
      required:
      - idempotency_key
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        cancel_reason:
          type: string
          maxLength: 500
    CancelledRegistration:
      type: object
      required:
      - registration_id
      - status
      - cancelled_at
      properties:
        registration_id:
          type: string
          format: uuid
        status:
          type: string
          const: cancelled
        cancelled_at:
          type: string
          format: date-time
        cancel_reason:
          type:
          - string
          - 'null'
    CancelRegistrationResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/CancelledRegistration"
    AllocationMode:
      type: string
      enum:
      - first_come_first_served
      - lottery
    EligibilityRuleInput:
      type: object
      additionalProperties: false
      properties:
        allow_all:
          type: boolean
          default: false
        department:
          type:
          - string
          - 'null'
        site:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        min_grade:
          type:
          - integer
          - 'null'
          minimum: 0
        employment_status:
          type:
          - string
          - 'null'
        custom_tags:
          type: array
          items:
            type: string
      description: Phase 1 eligibility rule input. `allow_all=true` represents an
        all-employee event; otherwise the supplied provider/HR claim predicates are
        combined by the implementation-defined rule version.
    CreateEventRequest:
      type: object
      required:
      - title
      - description
      - starts_at
      - registration_opens_at
      - registration_closes_at
      - event_city
      - event_site
      - capacity_type
      - capacity
      - allows_family
      - eligibility_rule
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        registration_opens_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        event_city:
          type: string
        event_site:
          type: string
        capacity_type:
          "$ref": "#/components/schemas/CapacityType"
        capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Required positive capacity for limited events; null for unlimited
            events.
        allows_family:
          type: boolean
          description: Must be false for limited events; may be true for unlimited
            events where bookings persist family_count.
        allocation_mode:
          "$ref": "#/components/schemas/AllocationMode"
          default: first_come_first_served
          description: Phase 1 supports first-come-first-served booking and deterministic
            lottery allocation for limited events.
        eligibility_rule:
          "$ref": "#/components/schemas/EligibilityRuleInput"
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        entry_method:
          type: string
          default: qr
        visibility:
          type: string
          default: eligible
    UpdateEventRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        registration_opens_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        event_city:
          type: string
        event_site:
          type: string
        capacity_type:
          "$ref": "#/components/schemas/CapacityType"
        capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Positive for limited events; null for unlimited events. Reductions
            below confirmed registrations must be rejected.
        allows_family:
          type: boolean
          description: Must remain false for limited events; may be true for unlimited
            events.
        allocation_mode:
          "$ref": "#/components/schemas/AllocationMode"
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        entry_method:
          type: string
        visibility:
          type: string
    ChangeEventStateRequest:
      type: object
      required:
      - status
      - reason
      additionalProperties: false
      properties:
        status:
          "$ref": "#/components/schemas/EventStatus"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EligibilityPreviewRequest:
      type: object
      required:
      - rule
      additionalProperties: false
      properties:
        rule:
          "$ref": "#/components/schemas/EligibilityRuleInput"
    EligibilityPreviewResult:
      type: object
      required:
      - event_id
      - match_count
      - zero_match
      properties:
        event_id:
          type: string
          format: uuid
        match_count:
          type: integer
          minimum: 0
        zero_match:
          type: boolean
        rule:
          "$ref": "#/components/schemas/EligibilityRuleInput"
    EligibilityPreviewResponseEnvelope:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/EligibilityPreviewResult"
    UpdateEligibilityRequest:
      type: object
      required:
      - rule
      - allow_zero_match
      additionalProperties: false
      properties:
        rule:
          "$ref": "#/components/schemas/EligibilityRuleInput"
        allow_zero_match:
          type: boolean
          description: Explicit confirmation required to save a zero-match rule.
    EligibilityImpactReview:
      type: object
      required:
      - review_id
      - event_id
      - status
      - reason
      - created_at
      properties:
        review_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        registration_id:
          type:
          - string
          - 'null'
          format: uuid
        ticket_id:
          type:
          - string
          - 'null'
          format: uuid
        employee_ref:
          type:
          - string
          - 'null'
          description: Redacted employee reference suitable for admin review.
        status:
          type: string
          enum:
          - open
          - resolved
          - ignored
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
    EligibilityImpactReviewListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - reviews
            properties:
              reviews:
                type: array
                items:
                  "$ref": "#/components/schemas/EligibilityImpactReview"
    ResolveImpactReviewRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EligibilityImpactReviewResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/EligibilityImpactReview"
    TicketStatus:
      type: string
      enum:
      - unused
      - checked_in
      - cancelled
      - expired
      - revoked
    TicketHolder:
      type: object
      required:
      - display_name
      - department
      - city
      properties:
        display_name:
          type: string
        department:
          type: string
        city:
          type: string
    TicketBase:
      type: object
      required:
      - ticket_id
      - event_id
      - event_title
      - status
      - holder
      - family_count
      - non_transferable
      - sequence_number
      properties:
        ticket_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
        registration_id:
          type:
          - string
          - 'null'
          format: uuid
        sequence_number:
          type: integer
          minimum: 1
        status:
          "$ref": "#/components/schemas/TicketStatus"
        holder:
          "$ref": "#/components/schemas/TicketHolder"
        family_count:
          type: integer
          minimum: 0
        non_transferable:
          type: boolean
          const: true
        first_checkin_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_reason:
          type:
          - string
          - 'null'
    RedactedTicket:
      allOf:
      - "$ref": "#/components/schemas/TicketBase"
      - type: object
        description: Admin/governance ticket view. Ticket tokens are intentionally
          omitted from this schema.
    RegistrationDetail:
      type: object
      required:
      - registration_id
      - event_id
      - status
      - family_count
      - created_at
      properties:
        registration_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        employee_ref:
          type:
          - string
          - 'null'
          description: Redacted employee reference for admin governance.
        employee_display_name:
          type:
          - string
          - 'null'
        status:
          "$ref": "#/components/schemas/BookingStatus"
        family_count:
          type: integer
          minimum: 0
        cancellation_deadline:
          type:
          - string
          - 'null'
          format: date-time
        cancel_reason:
          type:
          - string
          - 'null'
        ticket:
          oneOf:
          - "$ref": "#/components/schemas/RedactedTicket"
          - type: 'null'
        created_at:
          type: string
          format: date-time
    RegistrationListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - registrations
            properties:
              registrations:
                type: array
                items:
                  "$ref": "#/components/schemas/RegistrationDetail"
    AdminCancelRegistrationRequest:
      type: object
      required:
      - idempotency_key
      - reason
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PromoteWaitlistResult:
      type: object
      required:
      - remaining_capacity
      - message
      properties:
        promoted:
          oneOf:
          - "$ref": "#/components/schemas/BookingResult"
          - type: 'null'
        remaining_capacity:
          type: integer
          minimum: 0
        message:
          type: string
    PromoteWaitlistResponseEnvelope:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/PromoteWaitlistResult"
    LotteryRunRequest:
      type: object
      required:
      - seed
      additionalProperties: false
      properties:
        seed:
          type: string
          minLength: 1
          maxLength: 128
    LotteryRun:
      type: object
      required:
      - run_id
      - event_id
      - seed
      - status
      - winner_count
      - created_at
      properties:
        run_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        seed:
          type: string
        status:
          type: string
          enum:
          - completed
          - replayed
          - failed
        winner_count:
          type: integer
          minimum: 0
        waitlist_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    LotteryRunResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/LotteryRun"
    Ticket:
      allOf:
      - "$ref": "#/components/schemas/TicketBase"
      - type: object
        required:
        - qr_token
        properties:
          qr_token:
            type: string
            description: Signed display token for the employee who owns the ticket;
              it does not transfer ticket ownership.
    TicketListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - tickets
            properties:
              tickets:
                type: array
                items:
                  "$ref": "#/components/schemas/Ticket"
    TicketResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            oneOf:
            - "$ref": "#/components/schemas/Ticket"
            - "$ref": "#/components/schemas/RedactedTicket"
    RevokeTicketRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RedactedTicketResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/RedactedTicket"
    CreateCheckInRequest:
      type: object
      required:
      - ticket_token
      - event_id
      - device_id
      additionalProperties: false
      properties:
        ticket_token:
          type: string
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
        scanned_at:
          type:
          - string
          - 'null'
          format: date-time
        holder_mismatch_reason:
          type:
          - string
          - 'null'
          description: Staff-supplied reason when rejecting suspected transfer or
            proxy use.
    CheckInResolvedResult:
      type: object
      required:
      - status
      - reason_code
      - holder
      - family_count
      properties:
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - conflict
        reason_code:
          type: string
          enum:
          - accepted
          - duplicate_scan
          - offline_conflict
        checkin_id:
          type:
          - string
          - 'null'
          format: uuid
        first_checkin_at:
          type:
          - string
          - 'null'
          format: date-time
        holder:
          "$ref": "#/components/schemas/TicketHolder"
        family_count:
          type: integer
          minimum: 0
        rejection_message:
          type:
          - string
          - 'null'
    CheckInRejectedResult:
      type: object
      required:
      - status
      - reason_code
      properties:
        status:
          type: string
          const: rejected
        reason_code:
          type: string
          enum:
          - tampered_token
          - expired_ticket
          - revoked_ticket
          - event_mismatch
          - holder_mismatch
          - transfer_attempt
        checkin_id:
          type: 'null'
        first_checkin_at:
          type: 'null'
        holder:
          oneOf:
          - "$ref": "#/components/schemas/TicketHolder"
          - type: 'null'
          description: Present only when the rejected token can be safely resolved.
        family_count:
          type:
          - integer
          - 'null'
          minimum: 0
        rejection_message:
          type:
          - string
          - 'null'
    CheckInResult:
      oneOf:
      - "$ref": "#/components/schemas/CheckInResolvedResult"
      - "$ref": "#/components/schemas/CheckInRejectedResult"
    CheckInResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/CheckInResult"
    OfflineTicket:
      type: object
      required:
      - ticket_id
      - token_hash
      - holder
      - family_count
      properties:
        ticket_id:
          type: string
          format: uuid
        token_hash:
          type: string
          description: Hash of the signed ticket token; raw provider tokens are never
            included.
        holder:
          "$ref": "#/components/schemas/TicketHolder"
        family_count:
          type: integer
          minimum: 0
    OfflineCheckInPackage:
      type: object
      required:
      - batch_id
      - event_id
      - device_id
      - valid_until
      - package_signature
      - ticket_count
      - tickets
      properties:
        batch_id:
          type: string
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
        valid_until:
          type: string
          format: date-time
          description: Package validity must be bounded; Phase 1 default is 4 hours.
        package_signature:
          type: string
        ticket_count:
          type: integer
          minimum: 0
        tickets:
          type: array
          items:
            "$ref": "#/components/schemas/OfflineTicket"
    OfflineCheckInPackageResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/OfflineCheckInPackage"
    OfflineCheckInScanInput:
      type: object
      required:
      - ticket_token
      - scanned_at
      additionalProperties: false
      properties:
        ticket_token:
          type: string
        scanned_at:
          type: string
          format: date-time
        local_scan_id:
          type:
          - string
          - 'null'
    OfflineCheckInSyncRequest:
      type: object
      required:
      - batch_id
      - event_id
      - device_id
      - package_signature
      - scans
      additionalProperties: false
      properties:
        batch_id:
          type: string
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
        package_signature:
          type: string
        scans:
          type: array
          items:
            "$ref": "#/components/schemas/OfflineCheckInScanInput"
    OfflineCheckInSyncResult:
      type: object
      required:
      - batch_id
      - accepted
      - duplicate
      - conflict
      - results
      properties:
        batch_id:
          type: string
        accepted:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0
        conflict:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            "$ref": "#/components/schemas/CheckInResult"
    OfflineCheckInSyncResponseEnvelope:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/OfflineCheckInSyncResult"
    NotificationPreferences:
      type: object
      required:
      - email_enabled
      - in_app_enabled
      - opted_out_categories
      properties:
        email_enabled:
          type: boolean
        in_app_enabled:
          type: boolean
        opted_out_categories:
          type: array
          items:
            type: string
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    NotificationPreferencesResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/NotificationPreferences"
    UpdateNotificationPreferencesRequest:
      type: object
      required:
      - email_enabled
      - in_app_enabled
      - opted_out_categories
      additionalProperties: false
      properties:
        email_enabled:
          type: boolean
        in_app_enabled:
          type: boolean
        opted_out_categories:
          type: array
          items:
            type: string
    NotificationDeliveryStatus:
      type: string
      enum:
      - pending
      - sent
      - failed
      - suppressed
      - dead_letter
    NotificationDelivery:
      type: object
      required:
      - delivery_id
      - channel
      - status
      - attempts
      - created_at
      - updated_at
      properties:
        delivery_id:
          type: string
          format: uuid
        outbox_id:
          type:
          - string
          - 'null'
          format: uuid
        employee_ref:
          type:
          - string
          - 'null'
          description: Redacted recipient reference.
        channel:
          type: string
          enum:
          - email
          - in_app
        status:
          "$ref": "#/components/schemas/NotificationDeliveryStatus"
        attempts:
          type: integer
          minimum: 0
        last_error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationDeliveryListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - deliveries
            properties:
              deliveries:
                type: array
                items:
                  "$ref": "#/components/schemas/NotificationDelivery"
    NotificationDeliveryResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/NotificationDelivery"
    ReportRow:
      type: object
      required:
      - event_id
      - title
      - capacity_type
      - capacity
      - confirmed_count
      - waitlist_count
      - employee_count
      - family_count
      - total_attendee_count
      - ticket_count
      - checkin_count
      - remaining_capacity
      - city_distribution
      - starts_at
      properties:
        event_id:
          type: string
          format: uuid
        title:
          type: string
        capacity_type:
          "$ref": "#/components/schemas/CapacityType"
        capacity:
          type:
          - integer
          - 'null'
          minimum: 1
        confirmed_count:
          type: integer
          minimum: 0
        waitlist_count:
          type: integer
          minimum: 0
        employee_count:
          type: integer
          minimum: 0
        family_count:
          type: integer
          minimum: 0
        total_attendee_count:
          type: integer
          minimum: 0
        ticket_count:
          type: integer
          minimum: 0
        checkin_count:
          type: integer
          minimum: 0
        remaining_capacity:
          type:
          - integer
          - 'null'
          minimum: 0
        city_distribution:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        starts_at:
          type: string
          format: date-time
    ReportSummary:
      type: object
      required:
      - event_count
      - employee_count
      - family_count
      - total_attendee_count
      - city_distribution
      - rows
      properties:
        event_count:
          type: integer
          minimum: 0
        employee_count:
          type: integer
          minimum: 0
        family_count:
          type: integer
          minimum: 0
        total_attendee_count:
          type: integer
          minimum: 0
        city_distribution:
          type: array
          items:
            type: object
            required:
            - city
            - count
            properties:
              city:
                type: string
              count:
                type: integer
                minimum: 0
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/ReportRow"
    ReportSummaryResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/ReportSummary"
    ReportExportRequest:
      type: object
      required:
      - report_type
      additionalProperties: false
      properties:
        report_type:
          type: string
          enum:
          - participation
        format:
          type: string
          const: csv
          default: csv
    ReportExportStatus:
      type: string
      enum:
      - pending
      - ready
      - failed
    ReportExport:
      type: object
      required:
      - export_id
      - report_type
      - format
      - status
      - created_at
      properties:
        export_id:
          type: string
          format: uuid
        report_type:
          type: string
          enum:
          - participation
        format:
          type: string
          const: csv
        status:
          "$ref": "#/components/schemas/ReportExportStatus"
        object_key:
          type:
          - string
          - 'null'
          description: Object-storage key for the aggregate CSV export when ready.
        error_message:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    ReportExportResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/ReportExport"
    AuditLogEntry:
      type: object
      required:
      - audit_id
      - action
      - entity_type
      - entity_id
      - role
      - created_at
      properties:
        audit_id:
          type: string
          format: uuid
        actor_id:
          type:
          - string
          - 'null'
          description: Redacted actor identifier.
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        role:
          "$ref": "#/components/schemas/AppRole"
        created_at:
          type: string
          format: date-time
        redacted_metadata:
          type: object
          additionalProperties: true
    AuditLogListResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - entries
            properties:
              entries:
                type: array
                items:
                  "$ref": "#/components/schemas/AuditLogEntry"
              next_cursor:
                type:
                - string
                - 'null'
    ApiEnvelope:
      oneOf:
      - "$ref": "#/components/schemas/ApiSuccessEnvelope"
      - "$ref": "#/components/schemas/ApiErrorEnvelope"
    EligibilityRule:
      allOf:
      - "$ref": "#/components/schemas/EligibilityRuleInput"
      - type: object
        required:
        - rule_id
        - event_id
        - version
        properties:
          rule_id:
            type: string
            format: uuid
          event_id:
            type: string
            format: uuid
          version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
  responses:
    Unauthorized:
      description: Authentication is missing or provider token is invalid.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: Required claims are missing or mapped role is not allowed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
    Conflict:
      description: Request conflicts with state, capacity, cancellation, idempotency,
        or ticket ownership rules.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
    InternalServerError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorEnvelope"
