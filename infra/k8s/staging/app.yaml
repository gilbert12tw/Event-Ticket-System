apiVersion: batch/v1
kind: Job
metadata:
  name: cets-migrate
  namespace: cets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      restartPolicy: Never
      containers:
      - name: migrate
        image: cets-api:v0.0.1
        imagePullPolicy: IfNotPresent
        args: ["migrate"]
        envFrom:
        - configMapRef:
            name: cets-config
        - secretRef:
            name: cets-runtime-env
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cets-seed
  namespace: cets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      restartPolicy: Never
      containers:
      - name: seed
        image: cets-api:v0.0.1
        imagePullPolicy: IfNotPresent
        args: ["seed"]
        envFrom:
        - configMapRef:
            name: cets-config
        - secretRef:
            name: cets-runtime-env
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cets-config
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  APP_ADDR: ":8080"
  APP_ENV: "demo"
  AUTO_MIGRATE: "false"
  OPS_API_ENABLED: "false"
  POSTGRES_DB: "cets"
  REDIS_URL: "redis://redis:6379/0"
  QUEUE_URL: "redis://redis:6379/1"
  OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_BUCKET: "cets-dev"
  MAILER_HOST: "mailhog"
  MAILER_PORT: "1025"
  MAILER_FROM: "no-reply@cets.local"
  MAILER_REDIRECT_TO: ""
  REQUEST_TIMEOUT_MS: "5000"
  DATABASE_TIMEOUT_MS: "5000"
  SHUTDOWN_TIMEOUT_MS: "10000"
  BOOKING_PREADMISSION: "on"
  REDIS_OUTAGE_MODE: "degrade"
  OTEL_TRACES_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend
      containers:
      - name: backend
        image: cets-api:v0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_SERVICE_NAME
          value: cets-backend
        - name: CETS_REPLICA_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: cets-config
        - secretRef:
            name: cets-runtime-env
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  default.conf: |
    upstream cets_backend {
      server backend.cets.svc.cluster.local:8080 max_fails=1 fail_timeout=5s;
    }

    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-CETS-Frontend-Replica $hostname always;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://cets_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 3s;
        proxy_connect_timeout 1s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
      }

      location /readyz {
        proxy_pass http://cets_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 3s;
        proxy_connect_timeout 1s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
      }

      location /metrics {
        proxy_pass http://cets_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 3s;
        proxy_connect_timeout 1s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
      }

      location / {
        add_header X-CETS-Frontend-Replica $hostname always;
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      volumes:
      - name: frontend-nginx
        configMap:
          name: frontend-nginx
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend
      containers:
      - name: frontend
        image: cets-frontend:v0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: frontend-nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cets
  namespace: cets
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # TLS terminates at the Cloudflare edge; the tunnel reaches ingress-nginx
    # over plain HTTP, so an HTTPS force-redirect here would loop forever.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - stage.sky-lab.uk
    secretName: cets-tls
  rules:
  - host: stage.sky-lab.uk
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /healthz
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /readyz
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
---
