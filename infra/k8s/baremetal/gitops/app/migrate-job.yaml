apiVersion: batch/v1
kind: Job
metadata:
  name: cets-migrate
  labels:
    app.kubernetes.io/part-of: cets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: Never
      containers:
        - name: migrate
          image: cets-api:v0.0.1
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: cets-config
            - secretRef:
                name: cets-runtime-env
