apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-notification
  labels:
    app.kubernetes.io/part-of: cets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-notification
  template:
    metadata:
      labels:
        app: worker-notification
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: cets-api:v0.0.1
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: WORKER_KINDS
              value: notification
            - name: OTEL_SERVICE_NAME
              value: cets-worker-notification
            - name: CETS_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PYROSCOPE_APPLICATION_NAME
              value: cets-worker-notification
          envFrom:
            - configMapRef:
                name: cets-config
            - secretRef:
                name: cets-runtime-env
---
