AWSTemplateFormatVersion: '2010-09-09'
Description: CETS self-managed kubeadm Kubernetes on EC2 without EKS.

Parameters:
  StackPrefix:
    Type: String
    Default: cets-aws-k8s
  ClusterName:
    Type: String
    Default: cets
  NodeCount:
    Type: Number
    AllowedValues: [1, 3]
    Default: 3
  PurchaseOption:
    Type: String
    AllowedValues: [Spot, OnDemand]
    Default: OnDemand
  PrimaryInstanceType:
    Type: String
    Default: r6a.large
  FallbackInstanceType1:
    Type: String
    Default: r5a.large
  FallbackInstanceType2:
    Type: String
    Default: r6i.large
  WorkerMaxCapacity:
    Type: Number
    Default: 0
  RootVolumeGb:
    Type: Number
    Default: 120
  AdminCidr:
    Type: String
    Default: 0.0.0.0/32
  KeyName:
    Type: String
    Default: ''
  AppIngressMode:
    Type: String
    AllowedValues: [cloudflare, nlb]
    Default: cloudflare
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.42.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.42.2.0/24
  PublicSubnet3Cidr:
    Type: String
    Default: 10.42.3.0/24

Conditions:
  ThreeNode: !Equals [!Ref NodeCount, 3]
  UseSpot: !Equals [!Ref PurchaseOption, Spot]
  UseKeyName: !Not [!Equals [!Ref KeyName, '']]
  UseAppNlb: !Equals [!Ref AppIngressMode, nlb]
  ThreeNodeAndAppNlb: !And
    - !Equals [!Ref NodeCount, 3]
    - !Equals [!Ref AppIngressMode, nlb]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-vpc'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-igw'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-public'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-public-1'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-public-2'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-public-3'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CETS kubeadm node security group
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-nodes'
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  NodeSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref NodeSecurityGroup

  AdminApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 6443
      ToPort: 6443
      CidrIp: !Ref AdminCidr

  VpcApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ThreeNode
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 6443
      ToPort: 6443
      CidrIp: !Ref VpcCidr

  AdminSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseKeyName
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref AdminCidr

  AppNodePortIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAppNlb
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 30080
      ToPort: 30080
      CidrIp: 0.0.0.0/0

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackPrefix}-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: describe-bootstrap-context
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: '*'
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${StackPrefix}-node-profile'
      Roles:
        - !Ref NodeRole

  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${StackPrefix}-node'
      VersionDescription: cets-self-managed-k8s
      LaunchTemplateData:
        ImageId: !Ref AmiId
        IamInstanceProfile:
          Arn: !GetAtt NodeInstanceProfile.Arn
        KeyName: !If [UseKeyName, !Ref KeyName, !Ref AWS::NoValue]
        SecurityGroupIds:
          - !Ref NodeSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref RootVolumeGb
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux
            mkdir -p /etc/cets
            printf '%s\n' '${AWS::StackName}' >/etc/cets/stack-name
            printf '%s\n' '${ClusterName}' >/etc/cets/cluster-name
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: CetsCleanupGroup
              Value: !Ref StackPrefix

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: ThreeNode
    Properties:
      Name: !Sub '${StackPrefix}-api'
      Type: network
      Scheme: internet-facing
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: true
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: ThreeNode
    Properties:
      Name: !Sub '${StackPrefix}-api'
      VpcId: !Ref Vpc
      Protocol: TCP
      Port: 6443
      TargetType: instance
      HealthCheckProtocol: TCP
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: true
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: ThreeNode
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Protocol: TCP
      Port: 6443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: UseAppNlb
    Properties:
      Name: !Sub '${StackPrefix}-app'
      Type: network
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: UseAppNlb
    Properties:
      Name: !Sub '${StackPrefix}-app'
      VpcId: !Ref Vpc
      Protocol: TCP
      Port: 30080
      TargetType: instance
      HealthCheckProtocol: TCP
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseAppNlb
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  ControlPlaneAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${StackPrefix}-control-plane'
      MinSize: !Ref NodeCount
      MaxSize: !Ref NodeCount
      DesiredCapacity: !Ref NodeCount
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      TargetGroupARNs: !If
        - ThreeNodeAndAppNlb
        - [!Ref ApiTargetGroup, !Ref AppTargetGroup]
        - !If
          - ThreeNode
          - [!Ref ApiTargetGroup]
          - !If
            - UseAppNlb
            - [!Ref AppTargetGroup]
            - !Ref AWS::NoValue
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: !If [UseSpot, 0, !Ref NodeCount]
          OnDemandPercentageAboveBaseCapacity: !If [UseSpot, 0, 100]
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref NodeLaunchTemplate
            Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref PrimaryInstanceType
            - InstanceType: !Ref FallbackInstanceType1
            - InstanceType: !Ref FallbackInstanceType2
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-control-plane'
          PropagateAtLaunch: true
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix
          PropagateAtLaunch: true
        - {Key: Track, Value: aws-self-managed-k8s, PropagateAtLaunch: true}
        - Key: node.cets.io/role
          Value: control-plane
          PropagateAtLaunch: true

  WorkerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${StackPrefix}-workers'
      MinSize: 0
      MaxSize: !Ref WorkerMaxCapacity
      DesiredCapacity: 0
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: !If [UseSpot, 0, !Ref WorkerMaxCapacity]
          OnDemandPercentageAboveBaseCapacity: !If [UseSpot, 0, 100]
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref NodeLaunchTemplate
            Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref PrimaryInstanceType
            - InstanceType: !Ref FallbackInstanceType1
            - InstanceType: !Ref FallbackInstanceType2
      Tags:
        - Key: Name
          Value: !Sub '${StackPrefix}-worker'
          PropagateAtLaunch: true
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix
          PropagateAtLaunch: true
        - {Key: Track, Value: aws-self-managed-k8s, PropagateAtLaunch: true}
        - Key: node.cets.io/role
          Value: worker
          PropagateAtLaunch: true
        - Key: k8s.io/cluster-autoscaler/enabled
          Value: 'true'
          PropagateAtLaunch: true
        - Key: !Sub 'k8s.io/cluster-autoscaler/${ClusterName}'
          Value: owned
          PropagateAtLaunch: true

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${StackPrefix}/cets-api'
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix
        - {Key: Track, Value: aws-self-managed-k8s}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${StackPrefix}/cets-frontend'
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      Tags:
        - Key: CetsCleanupGroup
          Value: !Ref StackPrefix
        - {Key: Track, Value: aws-self-managed-k8s}

Outputs:
  VpcId:
    Value: !Ref Vpc
  NodeSecurityGroupId:
    Value: !Ref NodeSecurityGroup
  ControlPlaneAutoScalingGroupName:
    Value: !Ref ControlPlaneAutoScalingGroup
  WorkerAutoScalingGroupName:
    Value: !Ref WorkerAutoScalingGroup
  ApiEndpoint:
    Value: !If [ThreeNode, !Sub '${ApiLoadBalancer.DNSName}:6443', single-node]
  AppEndpoint:
    Value: !If [UseAppNlb, !GetAtt AppLoadBalancer.DNSName, cloudflare]
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
