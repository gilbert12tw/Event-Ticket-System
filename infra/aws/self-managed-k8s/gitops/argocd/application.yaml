apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cets-aws-self-managed
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cets
    cets.io/track: aws-self-managed-k8s
spec:
  project: default
  source:
    repoURL: https://github.com/gilbert12tw/Event-Ticket-System.git
    targetRevision: release/aws-self-managed-k8s
    path: infra/aws/self-managed-k8s/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: cets
  syncPolicy:
    # Automated sync is intentionally omitted until the release branch contains
    # real ECR image references and the matching release tag points at HEAD.
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
