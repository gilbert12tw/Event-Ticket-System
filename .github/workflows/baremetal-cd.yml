name: Baremetal ArgoCD CD

on:
  push:
    branches:
      - release/baremetal
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: baremetal-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      build_api: ${{ steps.filter.outputs.build_api }}
      build_frontend: ${{ steps.filter.outputs.build_frontend }}
      skip: ${{ steps.filter.outputs.skip }}
      image_tag: ${{ steps.filter.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$GITHUB_SHA"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

          changed_file=/tmp/baremetal-cd-changed-files
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git show --pretty="" --name-only "$GITHUB_SHA" > "$changed_file"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git show --pretty="" --name-only "$head" > "$changed_file"
            else
              git diff --name-only "$base" "$head" > "$changed_file"
            fi
          fi

          cat "$changed_file"
          if [ "$(wc -l < "$changed_file" | tr -d ' ')" = "1" ] &&
             grep -qx 'infra/k8s/baremetal/gitops/app/kustomization.yaml' "$changed_file" &&
             git log -1 --pretty=%s | grep -qx 'chore(baremetal-cd): update image tags'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "build_api=false" >> "$GITHUB_OUTPUT"
            echo "build_frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build_api=false
          build_frontend=false
          if grep -Eq '^(services/api/|go\.work(\.sum)?$|apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.npmrc$)' "$changed_file"; then
            build_api=true
          fi
          if grep -Eq '^(apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.npmrc$)' "$changed_file"; then
            build_frontend=true
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "build_api=$build_api" >> "$GITHUB_OUTPUT"
          echo "build_frontend=$build_frontend" >> "$GITHUB_OUTPUT"

  quality-gates:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      run_full_ci: true
      run_live_playwright: true
      run_k6_smoke: true
      run_k6_release: true
    permissions:
      contents: read

  build-push-and-promote:
    needs:
      - changes
      - quality-gates
    if: >-
      needs.changes.outputs.skip != 'true' &&
      (needs.changes.outputs.build_api == 'true' || needs.changes.outputs.build_frontend == 'true')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    env:
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      API_IMAGE: ghcr.io/gilbert12tw/event-ticket-system/cets-api
      FRONTEND_IMAGE: ghcr.io/gilbert12tw/event-ticket-system/cets-frontend
      KUSTOMIZATION: infra/k8s/baremetal/gitops/app/kustomization.yaml
    steps:
      - name: Check out release branch
        if: env.ACT != 'true'
        uses: actions/checkout@v4
        with:
          ref: release/baremetal
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out local act workspace
        if: env.ACT == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        if: env.ACT != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.ACT != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        if: env.ACT != 'true' && needs.changes.outputs.build_api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=cets-api-release-baremetal
          cache-to: type=gha,mode=max,scope=cets-api-release-baremetal
      - name: Build and push frontend image
        if: env.ACT != 'true' && needs.changes.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=cets-frontend-release-baremetal
          cache-to: type=gha,mode=max,scope=cets-frontend-release-baremetal
      - name: Skip remote image publishing under act
        if: env.ACT == 'true'
        run: |
          echo "act dry run: skipping GHCR login, image push, and remote GitOps promotion."
      - name: Update GitOps image tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.build_api }}" = "true" ]; then
            awk -v tag="$IMAGE_TAG" '
              $0 ~ /newName: ghcr\.io\/.*\/cets-api$/ { in_image=1; print; next }
              in_image == 1 && $1 == "newTag:" { sub(/newTag: .*/, "newTag: " tag); in_image=0 }
              { print }
            ' "$KUSTOMIZATION" > "$KUSTOMIZATION.tmp"
            mv "$KUSTOMIZATION.tmp" "$KUSTOMIZATION"
          fi
          if [ "${{ needs.changes.outputs.build_frontend }}" = "true" ]; then
            awk -v tag="$IMAGE_TAG" '
              $0 ~ /newName: ghcr\.io\/.*\/cets-frontend$/ { in_image=1; print; next }
              in_image == 1 && $1 == "newTag:" { sub(/newTag: .*/, "newTag: " tag); in_image=0 }
              { print }
            ' "$KUSTOMIZATION" > "$KUSTOMIZATION.tmp"
            mv "$KUSTOMIZATION.tmp" "$KUSTOMIZATION"
          fi
          infra/k8s/baremetal/scripts/82-verify-release-gitops.sh
      - name: Show local act promotion diff
        if: env.ACT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff -- "$KUSTOMIZATION"
          git checkout -- "$KUSTOMIZATION"
      - name: Commit GitOps promotion
        if: env.ACT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$KUSTOMIZATION"; then
            echo "GitOps image tags already point at $IMAGE_TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION"
          git commit -m "chore(baremetal-cd): update image tags"
          git push origin HEAD:release/baremetal

  no-image-change:
    needs:
      - changes
      - quality-gates
    if: >-
      needs.changes.outputs.skip != 'true' &&
      needs.changes.outputs.build_api != 'true' &&
      needs.changes.outputs.build_frontend != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: No image rebuild required
        run: echo "Release branch changed GitOps/docs/config only; ArgoCD will sync committed manifests."
