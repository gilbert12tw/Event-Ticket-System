name: AWS K8s GitOps Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/aws-k8s-release.yml"
      - "docs/specs/aws-self-managed-k8s.md"
      - "infra/aws/self-managed-k8s/**"
  push:
    branches:
      - release/aws-self-managed-k8s
    tags:
      - "v*"
    paths:
      - ".github/workflows/aws-k8s-release.yml"
      - "docs/specs/aws-self-managed-k8s.md"
      - "infra/aws/self-managed-k8s/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-k8s-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-gitops-release:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/release/aws-self-managed-k8s' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          for file in infra/aws/self-managed-k8s/scripts/*.sh infra/aws/self-managed-k8s/scripts/deploy-cets/*.sh; do
            bash -n "$file"
          done
      - name: Validate release GitOps manifests
        env:
          CETS_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: infra/aws/self-managed-k8s/scripts/82-verify-release-gitops.sh
