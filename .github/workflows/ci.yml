name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".actrc"
      - ".dockerignore"
      - ".npmrc"
      - ".prettierignore"
      - "AGENTS.md"
      - "apps/web/**"
      - "docs/ARCHITECTURE.md"
      - "docs/agent-rules/**"
      - "docs/archive/**"
      - "docs/DESIGN.md"
      - "docs/INDEX.md"
      - "docs/openapi.yaml"
      - "docs/openapi/**"
      - "docs/principles/**"
      - "docs/PRODUCT.md"
      - "docs/specs/**"
      - "eslint.config.mjs"
      - "go.work"
      - "go.work.sum"
      - "goal.md"
      - "k6/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/compose/**"
      - "scripts/ci/**"
      - "scripts/*openapi*"
      - "services/api/**"
      - "turbo.json"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/ci.yml"
      - ".actrc"
      - ".dockerignore"
      - ".npmrc"
      - ".prettierignore"
      - "AGENTS.md"
      - "apps/web/**"
      - "docs/ARCHITECTURE.md"
      - "docs/agent-rules/**"
      - "docs/archive/**"
      - "docs/DESIGN.md"
      - "docs/INDEX.md"
      - "docs/openapi.yaml"
      - "docs/openapi/**"
      - "docs/principles/**"
      - "docs/PRODUCT.md"
      - "docs/specs/**"
      - "eslint.config.mjs"
      - "go.work"
      - "go.work.sum"
      - "goal.md"
      - "k6/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/compose/**"
      - "scripts/ci/**"
      - "scripts/*openapi*"
      - "services/api/**"
      - "turbo.json"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      run_full_ci:
        description: Run the complete release gate
        required: false
        type: boolean
        default: false
      run_live_playwright:
        description: Run Compose-backed live Playwright checks
        required: false
        type: boolean
        default: false
      run_k6_smoke:
        description: Run the k6 smoke profile
        required: false
        type: boolean
        default: false
      run_k6_release:
        description: Run the k6 release profile
        required: false
        type: boolean
        default: false
      k6_release_duration:
        description: k6 release profile duration for manual runs
        required: false
        type: string
        default: 10s

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_lint: ${{ steps.filter.outputs.backend_lint }}
      backend_test: ${{ steps.filter.outputs.backend_test }}
      frontend_static: ${{ steps.filter.outputs.frontend_static }}
      frontend_unit: ${{ steps.filter.outputs.frontend_unit }}
      frontend_e2e: ${{ steps.filter.outputs.frontend_e2e }}
      openapi: ${{ steps.filter.outputs.openapi }}
      compose: ${{ steps.filter.outputs.compose }}
      live: ${{ steps.filter.outputs.live }}
      k6: ${{ steps.filter.outputs.k6 }}
      phase3: ${{ steps.filter.outputs.phase3 }}
      quick: ${{ steps.filter.outputs.quick }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.event.after }}
          INPUT_RUN_FULL_CI: ${{ inputs.run_full_ci || 'false' }}
          INPUT_RUN_LIVE_PLAYWRIGHT: ${{ inputs.run_live_playwright || 'false' }}
          INPUT_RUN_K6_SMOKE: ${{ inputs.run_k6_smoke || 'false' }}
          INPUT_RUN_K6_RELEASE: ${{ inputs.run_k6_release || 'false' }}
        run: bash scripts/ci/detect-changes.sh

  quick-check:
    needs: changes
    if: needs.changes.outputs.quick == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: No code gates required
        run: echo "Only documentation or agent metadata changed; diff whitespace was checked in changes job."

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend_lint == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: ${{ env.ACT != 'true' }}
          cache-dependency-path: services/api/go.sum
      - name: Restore Node path for local act runs
        if: env.ACT == 'true'
        run: |
          if command -v node >/dev/null 2>&1; then
            node_bin="$(dirname "$(command -v node)")"
          else
            node_bin="$(dirname "$(/usr/bin/find /opt/acttoolcache/node -path '*/bin/node' -type f | /usr/bin/sort -V | /usr/bin/tail -n 1)")"
          fi
          echo "$node_bin" >> "$GITHUB_PATH"
      - name: Run Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: services/api
          args: --timeout=5m

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend_test == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: cets_test
          POSTGRES_USER: cets
          POSTGRES_PASSWORD: cets_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cets -d cets_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://cets:cets_test_password@localhost:5432/cets_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: ${{ env.ACT != 'true' }}
          cache-dependency-path: services/api/go.sum
      - name: Run Go tests
        working-directory: services/api
        # Keep package tests serialized because integration suites share the CI Postgres service.
        run: go test ./... -count=1 -p=1 -timeout=20m

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby for local act runs
        if: env.ACT == 'true'
        run: |
          if command -v ruby >/dev/null 2>&1; then
            ruby --version
            exit 0
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ruby
          ruby --version
      - name: Verify OpenAPI contract
        run: ruby scripts/check-openapi-contract.rb

  compose-contract:
    needs: changes
    if: needs.changes.outputs.compose == 'true' || needs.changes.outputs.phase3 == 'true' || needs.changes.outputs.live == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: ${{ env.ACT != 'true' }}
          cache-dependency-path: services/api/go.sum
      - name: Set up Docker CLI for local act runs
        uses: ./.github/actions/setup-docker-act
      - name: Validate Compose configs
        run: |
          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml config
          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation config
          docker compose \
            --env-file services/api/deploy/.env.example \
            -f services/api/deploy/compose.yaml \
            -f services/api/deploy/compose.worker-isolation.yaml \
            -f services/api/deploy/compose.phase3-ha.yaml \
            --profile phase3-ha \
            --profile worker-isolation \
            --profile observability \
            --profile phase3-canary \
            config >/tmp/cets-phase3-compose-config.yaml
      - name: Validate deploy contracts
        working-directory: services/api
        run: go test ./deploy -count=1

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend_static == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up web workspace
        uses: ./.github/actions/setup-web
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-
            ${{ runner.os }}-turbo-main-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-
            ${{ runner.os }}-turbo-
      - name: Lint web
        run: pnpm lint:web
      - name: Type-check web
        run: pnpm type-check
      - name: Check formatting
        run: pnpm format:check

  frontend-unit-build:
    needs: changes
    if: needs.changes.outputs.frontend_unit == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up web workspace
        uses: ./.github/actions/setup-web
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-
            ${{ runner.os }}-turbo-main-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/turbo.json') }}-
            ${{ runner.os }}-turbo-
      - name: Test web
        env:
          VITEST_MAX_WORKERS: ${{ vars.CI_VITEST_MAX_WORKERS || '2' }}
          VITEST_TEST_TIMEOUT: ${{ vars.CI_VITEST_TEST_TIMEOUT || '20000' }}
        run: |
          if [ "${ACT:-}" = "true" ] && [ "${VITEST_MAX_WORKERS}" = "2" ]; then
            export VITEST_MAX_WORKERS=1
          fi
          pnpm --filter cets-web test
      - name: Build web
        run: pnpm --filter cets-web build

  frontend-e2e:
    needs:
      - changes
    if: needs.changes.outputs.frontend_e2e == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: 1
            port: 4173
          - shard: 2
            port: 4174
          - shard: 3
            port: 4175
          - shard: 4
            port: 4176
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up web workspace
        uses: ./.github/actions/setup-web
      - name: Verify GitHub Chrome runtime
        if: env.ACT != 'true'
        run: scripts/ci/verify-playwright-runtime.sh chrome
      - name: Verify local act Playwright runtime
        if: env.ACT == 'true'
        run: bash scripts/ci/install-playwright.sh chromium
      - name: Run mocked Playwright viewport checks shard ${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/mock-shard-${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT: test-results/mock-shard-${{ matrix.shard }}/playwright-results.json
          PLAYWRIGHT_MOCK_PORT: ${{ matrix.port }}
          PLAYWRIGHT_OUTPUT_DIR: test-results/mock-shard-${{ matrix.shard }}
          PLAYWRIGHT_WORKERS: ${{ vars.CI_PLAYWRIGHT_WORKERS || '2' }}
        run: |
          if [ "${ACT:-}" != "true" ]; then
            export PLAYWRIGHT_BROWSER_CHANNEL=chrome
            export PLAYWRIGHT_DISABLE_VIDEO=true
          fi
          if [ "${ACT:-}" = "true" ] && [ "${PLAYWRIGHT_WORKERS}" = "2" ]; then
            export PLAYWRIGHT_WORKERS=1
          fi
          pnpm --filter cets-web exec playwright test --shard=${{ matrix.shard }}/4
      - name: Upload mocked Playwright artifacts on failure
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-artifacts-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - name: Clean local act frontend outputs
        if: success() && env.ACT == 'true'
        run: |
          rm -rf \
            apps/web/test-results/mock-shard-${{ matrix.shard }} \
            apps/web/playwright-report/mock-shard-${{ matrix.shard }}

  live-gates:
    needs:
      - changes
      - backend-lint
      - backend-test
      - openapi
      - compose-contract
      - frontend-static
      - frontend-unit-build
      - frontend-e2e
    if: >-
      always() &&
      needs.changes.outputs.live == 'true' &&
      (needs['backend-lint'].result == 'success' || needs['backend-lint'].result == 'skipped') &&
      (needs['backend-test'].result == 'success' || needs['backend-test'].result == 'skipped') &&
      (needs.openapi.result == 'success' || needs.openapi.result == 'skipped') &&
      (needs['compose-contract'].result == 'success' || needs['compose-contract'].result == 'skipped') &&
      (needs['frontend-static'].result == 'success' || needs['frontend-static'].result == 'skipped') &&
      (needs['frontend-unit-build'].result == 'success' || needs['frontend-unit-build'].result == 'skipped') &&
      (needs['frontend-e2e'].result == 'success' || needs['frontend-e2e'].result == 'skipped')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    env:
      K6_IMAGE: grafana/k6:1.7.1-with-browser
      COMPOSE_PROJECT_NAME: cets-ci
      APP_PORT: 28080
      POSTGRES_PORT: 25432
      REDIS_PORT: 26379
      MINIO_API_PORT: 29000
      MINIO_CONSOLE_PORT: 29001
      MAILHOG_SMTP_PORT: 21025
      MAILHOG_UI_PORT: 28025
      API_IMAGE_TAG: ci
      LIVE_BASE_URL: http://127.0.0.1:28080
      K6_RELEASE_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.k6_release_duration || '10s' }}
      K6_CHANGED: ${{ needs.changes.outputs.k6 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up web workspace
        uses: ./.github/actions/setup-web
      - name: Verify GitHub Chrome runtime
        if: env.ACT != 'true'
        run: scripts/ci/verify-playwright-runtime.sh chrome
      - name: Verify local act Playwright runtime
        if: env.ACT == 'true'
        run: bash scripts/ci/install-playwright.sh chromium
      - name: Set up Docker CLI for local act runs
        uses: ./.github/actions/setup-docker-act
      - name: Validate Phase 3 Compose scripts
        run: bash -n scripts/compose/phase3-deploy.sh scripts/compose/phase3-verify.sh scripts/compose/phase3-drill.sh
      - name: Reset local act live volumes
        if: env.ACT == 'true'
        run: docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation down --volumes --remove-orphans
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          load: true
          tags: cets-api:ci
          cache-from: |
            type=gha,scope=cets-api-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            type=gha,scope=cets-api-main
          cache-to: type=gha,mode=max,scope=cets-api-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Start backing services for live gates
        run: docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml up -d postgres redis minio mailhog minio-init
      - name: Run explicit database migration
        run: docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml run --rm migrate
      - name: Start API services for live gates
        run: docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation up -d app worker-notification worker-projection worker-compensation worker-export
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$LIVE_BASE_URL/readyz"; then
              break
            fi
            sleep 2
          done
          curl -fsS "$LIVE_BASE_URL/readyz" >/dev/null
      - name: Run live Playwright workflow checks
        if: github.event_name != 'workflow_dispatch' || inputs.run_full_ci || inputs.run_live_playwright
        run: |
          if [ "${ACT:-}" != "true" ]; then
            export PLAYWRIGHT_BROWSER_CHANNEL=chrome
            export PLAYWRIGHT_DISABLE_VIDEO=true
          fi
          PLAYWRIGHT_LIVE_BASE_URL="$LIVE_BASE_URL" pnpm --filter cets-web test:e2e:live
      - name: Inject WS4 notification failure pressure
        run: |
          WORKER_NOTIFICATION_MAILER_HOST=127.0.0.1 WORKER_NOTIFICATION_MAILER_PORT=1 \
            docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation up -d --force-recreate worker-notification
      - name: Seed WS4 non-notification worker evidence
        run: |
          suffix="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml exec -T postgres psql -U cets -d cets -c "
            INSERT INTO outbox_events (outbox_id, aggregate_id, event_type, payload, publish_status, available_at)
            VALUES
              ('out-k6-projection-${suffix}', 'projection-k6-${suffix}', 'reporting.projection.update_required.v2', '{\"projection\":\"worker_isolation\"}'::jsonb, 'pending', now())
            ON CONFLICT (outbox_id) DO NOTHING;"
      - name: Run k6 smoke gate checks
        if: env.K6_CHANGED == 'true' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.run_full_ci || inputs.run_k6_smoke))
        run: docker run --rm -i --network host --cap-add=SYS_ADMIN -e BASE_URL="$LIVE_BASE_URL" -e K6_BROWSER_ENABLED=true -e K6_SMOKE_DURATION=20s "$K6_IMAGE" run - < k6/phase1-production-gate.js
      - name: Run k6 release gate checks
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.run_full_ci || inputs.run_k6_release))
        run: docker run --rm -i --network host -e BASE_URL="$LIVE_BASE_URL" -e K6_RELEASE_DURATION="$K6_RELEASE_DURATION" "$K6_IMAGE" run - < k6/phase1-release-gate.js
      - name: Run WS4 worker isolation lag gate
        run: |
          docker run --rm -i --network host \
            -e BASE_URL="$LIVE_BASE_URL" \
            -e K6_OUTBOX_P95_MAX_SECONDS=60 \
            -e K6_OUTBOX_MAX_SECONDS=180 \
            -e K6_REQUIRED_WORKER_KINDS=export,projection \
            "$K6_IMAGE" run - < k6/phase2-worker-isolation-lag.js
      - name: Scan live gate logs for sensitive leakage
        run: |
          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation logs --no-color app worker-notification worker-projection worker-compensation worker-export > /tmp/cets-app-worker.log
          if grep -E -i 'signed[_ -]?token|qr_payload|auth_session|token_signing|object_storage_secret|session=|set-cookie|local_dev_.*secret|[A-Za-z0-9._%+-]+@cets\.local|Ariel Chen|Ben Lin|Carla Wu' /tmp/cets-app-worker.log; then
            echo "Sensitive app/worker log output detected" >&2
            exit 1
          fi

          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml logs --no-color mailhog > /tmp/cets-mailhog.log
          if grep -E -i 'e1001@cets\.local|e1002@cets\.local|e2001@cets\.local|Ariel Chen|Ben Lin|Carla Wu' /tmp/cets-mailhog.log; then
            echo "Employee-specific MailHog recipient or full-name output detected" >&2
            exit 1
          fi
          grep -E -i 'notifications@cets\.local' /tmp/cets-mailhog.log >/dev/null
      - name: Upload Playwright artifacts on failure
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/playwright-live-report
            apps/web/test-results
      - name: Clean local act live artifacts
        if: success() && env.ACT == 'true'
        run: |
          rm -rf \
            apps/web/test-results \
            apps/web/playwright-live-report
      - name: Stop API services
        if: always()
        run: |
          down_args=()
          if [[ "${ACT:-}" == "true" ]]; then
            down_args+=(--volumes --remove-orphans)
          fi
          docker compose --env-file services/api/deploy/.env.example -f services/api/deploy/compose.yaml -f services/api/deploy/compose.worker-isolation.yaml --profile worker-isolation down "${down_args[@]}"
